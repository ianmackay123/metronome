<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Metronome Speed Trainer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Music&display=swap">
  <style>
    .music-symbol {
      font-family: 'Noto Music', 'Noto Sans Symbols2', 'Segoe UI Symbol', 'Apple Symbols', serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; scrollbar-width: none; }
    *::-webkit-scrollbar { display: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      overflow-x: hidden;
      padding-top: env(safe-area-inset-top);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .app {
      max-width: 1100px;
      width: 100%;
      padding: 1rem 1.5rem;
      margin: 0 auto;
    }
    .settings-row {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .settings-row .tempo-section {
      margin-bottom: 0;
      flex: 1;
      min-width: 150px;
    }
    .bar-row {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }
    .bar-row .bar-grid-wrapper {
      flex: 1;
      min-width: 0;
    }
    h1 {
      text-align: center;
      margin-bottom: 0.6rem;
      font-size: 1.5rem;
      color: #e94560;
    }
    .tempo-section {
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .tempo-section label {
      font-weight: 600;
      white-space: nowrap;
      min-width: 55px;
    }
    .tempo-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex: 1;
    }
    .tempo-row input[type="range"] {
      flex: 1;
      accent-color: #e94560;
    }
    .tempo-row input[type="number"] {
      width: 70px;
      padding: 0.3rem;
      border: 1px solid #444;
      border-radius: 4px;
      background: #16213e;
      color: #eee;
      text-align: center;
      font-size: 1rem;
    }
    .pattern-section {
      margin-bottom: 1rem;
    }
    .pattern-section h2 {
      font-size: 1rem;
      margin-bottom: 0.4rem;
    }
    .note-palette {
      background: #16213e;
      border-radius: 8px;
      padding: 0.6rem;
      margin-bottom: 0.8rem;
      display: none;
    }
    .app.edit-mode .note-palette { display: block; }
    .beat-cell .remove-btn { display: none !important; }
    .app.edit-mode .beat-cell .remove-btn { display: flex !important; }
    .beat-cell .pitch-input,
    .beat-cell .bend-row,
    .beat-cell .note-name { display: none !important; }
    .beat-cell .bend-indicator {
      font-size: 0.7rem;
      color: #ff8a5c;
      position: absolute;
      top: 22px;
      right: 2px;
      line-height: 1;
    }
    .app.edit-mode .beat-cell .bend-indicator { display: none; }
    .app.edit-mode .beat-cell { grid-template-rows: 22px 2.4rem 0.9rem 30px 30px; }
    .app.edit-mode .beat-cell .note-name { display: block !important; }
    .app.edit-mode .beat-cell .pitch-input { display: block !important; }
    .app.edit-mode .beat-cell .bend-row { display: flex !important; }
    .edit-bar {
      display: none;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1rem;
      padding: 0.6rem 1rem;
      background: #16213e;
      border-radius: 8px;
      flex-wrap: wrap;
    }
    .app.edit-mode .edit-bar { display: flex; }
    .edit-bar label { font-size: 0.85rem; color: #ccc; }
    .edit-bar select, .edit-bar input[type="text"], .edit-bar input[type="number"] {
      padding: 0.3rem 0.5rem;
      border: 1px solid #444;
      border-radius: 4px;
      background: #0f3460;
      color: #eee;
      font-size: 0.85rem;
      min-width: 0;
    }
    .edit-bar input[type="text"] { width: 100px; max-width: 30vw; }
    .edit-bar input[type="number"] { width: 45px; max-width: 15vw; }
    .edit-bar select { max-width: 25vw; }
    .edit-bar .save-btn {
      padding: 0.4rem 1rem;
      border: none;
      border-radius: 4px;
      background: #27ae60;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .edit-bar .save-btn:hover { background: #2ecc71; }
    .edit-bar .cancel-btn {
      padding: 0.4rem 1rem;
      border: 1px solid #444;
      border-radius: 4px;
      background: #333;
      color: #eee;
      cursor: pointer;
    }
    .edit-bar .cancel-btn:hover { background: #444; }
    .edit-bar .delete-btn {
      padding: 0.4rem 1rem;
      border: 1px solid #e94560;
      border-radius: 4px;
      background: transparent;
      color: #e94560;
      cursor: pointer;
      margin-left: auto;
    }
    .edit-bar .delete-btn:hover { background: #e94560; color: white; }
    .edit-bar .delete-btn.hidden { display: none; }
    .palette-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 0.3rem 0;
      user-select: none;
    }
    .palette-toggle h3 {
      font-size: 0.85rem;
      color: #ccc;
    }
    .palette-toggle .arrow {
      font-size: 0.7rem;
      color: #888;
      transition: transform 0.2s;
    }
    .palette-toggle.open .arrow { transform: rotate(180deg); }
    .palette-body {
      display: none;
      padding-top: 0.4rem;
    }
    .palette-body.open { display: block; }
    .add-row {
      display: flex;
      align-items: flex-start;
      margin-bottom: 0.5rem;
      gap: 1.5rem;
    }
    .add-group {
      display: flex;
      flex-direction: column;
    }
    .add-group .add-buttons {
      margin-bottom: 0;
    }
    .add-group-label {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #777;
      margin-bottom: 0.2rem;
    }
    .add-buttons {
      display: flex;
      gap: 0.3rem;
      margin-bottom: 0.4rem;
      flex-wrap: wrap;
    }
    .add-section-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #777;
      margin-top: 0.4rem;
      margin-bottom: 0.15rem;
    }
    .add-buttons button {
      padding: 0.25rem 0.5rem;
      border: 1px solid #444;
      border-radius: 4px;
      background: #0f3460;
      color: #eee;
      cursor: pointer;
      font-family: 'Noto Music', 'Noto Sans Symbols2', 'Segoe UI Symbol', 'Apple Symbols', -apple-system, sans-serif;
      font-size: 1.7rem;
      transition: background 0.15s;
    }
    .add-buttons button:hover { background: #1a5276; }
    .bar-container {
      background: #16213e;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      min-height: 60px;
    }
    .bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .bar-label {
      font-weight: 600;
      font-size: 0.9rem;
      color: #aaa;
    }
    .bar-beats-info {
      font-size: 0.8rem;
      color: #888;
    }
    .beat-grid {
      display: flex;
      gap: 0;
      align-items: stretch;
      width: 100%;
      min-width: 0;
      overflow: hidden;
    }
    .beat-cell {
      display: grid;
      grid-template-rows: 22px 2.4rem 0 0 0;
      align-items: center;
      justify-items: start;
      cursor: pointer;
      border-radius: 4px;
      padding: 4px 4px;
      transition: background 0.15s;
      position: relative;
      min-width: 0;
      border-right: 1px solid rgba(255,255,255,0.05);
    }
    .beat-cell:last-child { border-right: none; }
    .bar-grid-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
    }
    .bar-notes-row {
      position: relative;
      display: flex;
      align-items: stretch;
      width: 100%;
    }
    .bar-labels {
      display: none;
    }
    .app.edit-mode .bar-labels {
      display: grid;
      grid-template-rows: 22px 2.4rem 0.9rem 30px 30px;
      align-items: center;
      position: absolute;
      right: 100%;
      top: 0;
      padding-right: 6px;
    }
    .bar-labels span {
      font-size: 0.6rem;
      color: #777;
      text-align: right;
      white-space: nowrap;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      justify-self: center;
    }
    .beat-cell:hover { background: rgba(233,69,96,0.15); }
    .beat-cell.active { background: rgba(233,69,96,0.35); }
    .beat-cell .note-bar {
      position: relative;
      width: 90%;
      height: 100%;
      border-radius: 3px;
    }
    .beat-cell .note-label {
      font-family: 'Noto Music', 'Noto Sans Symbols2', 'Segoe UI Symbol', 'Apple Symbols', serif;
      font-size: 2.4rem;
      color: #aaa;
      margin-top: 3px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2.4rem;
    }
    .beat-cell .note-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.55rem;
      color: #666;
      margin-top: 1px;
    }
    .beat-cell .pitch-input {
      width: 100%;
      max-width: 38px;
      height: 20px;
      font-size: 0.85rem;
      text-align: center;
      border: 1px solid #444;
      border-radius: 3px;
      background: #0f3460;
      color: #eee;
      padding: 0 1px;
    }
    .beat-cell .pitch-input:focus {
      outline: 1px solid #e94560;
      border-color: #e94560;
    }
    .beat-cell .bend-row {
      display: flex;
      align-items: center;
      gap: 1px;
      width: 100%;
      max-width: 54px;
    }
    .beat-cell .bend-dir {
      width: 18px;
      min-width: 14px;
      height: 20px;
      border: 1px solid #444;
      border-radius: 3px;
      background: #0f3460;
      color: #ff8a5c;
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
      flex-shrink: 0;
    }
    .beat-cell .bend-dir:hover { background: #1a5276; }
    .beat-cell .bend-input {
      width: 100%;
      min-width: 0;
      height: 20px;
      font-size: 0.78rem;
      text-align: center;
      border: 1px solid #444;
      border-radius: 3px;
      background: #0f3460;
      color: #ff8a5c;
      padding: 0 1px;
    }
    .beat-cell .bend-input:focus {
      outline: 1px solid #ff8a5c;
      border-color: #ff8a5c;
    }
    .beat-cell .remove-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 10px;
      border: none;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
      z-index: 2;
    }
    .controls {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      margin-bottom: 0.8rem;
    }
    .controls button {
      padding: 0.6rem 1.8rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .controls button:active { transform: scale(0.95); }
    .play-btn {
      background: #e94560;
      color: white;
    }
    .play-btn.playing { background: #ff8a5c; }
    .reset-btn {
      display: none;
      background: #333;
      color: #eee;
    }
    .app.edit-mode .reset-btn { display: inline-block; }
    .reset-btn:hover { background: #444; }
    .count-in-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid #444;
      background: #333;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .count-in-btn:hover { border-color: #e94560; }
    .count-in-btn.active { background: #e94560; border-color: #e94560; }
    .visualizer {
      height: 40px;
      background: #16213e;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .visualizer .tick-marker {
      position: absolute;
      bottom: 0;
      width: 2px;
      background: #444;
      height: 100%;
    }
    .visualizer .playhead-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 3px;
      background: #e94560;
      border-radius: 2px;
      transition: left 0.05s linear;
    }
    .visualizer .flash {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 80px;
      margin-left: -40px;
      background: radial-gradient(ellipse at center, rgba(255,255,255,1) 0%, rgba(255,255,255,0.6) 30%, rgba(255,255,255,0) 70%);
      opacity: 0;
      transition: opacity 0.12s ease-out;
      pointer-events: none;
    }
    .visualizer .flash.on { opacity: 1; transition: none; }

    .presets-section {
      margin-bottom: 1rem;
    }
    .presets-section label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }
    .presets-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .presets-row button {
      padding: 0.4rem 0.8rem;
      border: 1px solid #444;
      border-radius: 4px;
      background: #16213e;
      color: #eee;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.15s;
    }
    .presets-row button:hover { background: #0f3460; }
    .presets-row button.active {
      background: #e94560;
      border-color: #e94560;
    }

    .tab-grid-wrapper {
      position: relative;
      width: 100%;
      margin-top: 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 0.8rem;
    }
    .tab-labels {
      position: absolute;
      right: 100%;
      top: 0.8rem;
      display: flex;
      flex-direction: column;
      padding-right: 6px;
    }
    .tab-labels span {
      font-size: 1rem;
      font-family: 'Courier New', monospace;
      color: #777;
      line-height: 1.3;
      height: 1.8rem;
      text-align: right;
    }
    .tab-grid {
      display: flex;
      gap: 0;
      width: 100%;
      min-width: 0;
      overflow: hidden;
    }
    .tab-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
    }
    .tab-cell span {
      font-family: 'Courier New', monospace;
      font-size: 1.5rem;
      color: #aaa;
      line-height: 1.3;
      height: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      padding-left: 4px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .tab-cell span.tab-fret {
      color: #e94560;
      font-weight: 600;
    }
    .tab-edit-input {
      width: 100%;
      max-width: 40px;
      height: 1.6rem;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      text-align: center;
      border: 1px solid #e94560;
      border-radius: 3px;
      background: #0f3460;
      color: #e94560;
      padding: 0 2px;
      outline: none;
    }

    button, select, input { touch-action: manipulation; }

    .presets-select {
      display: none;
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #444;
      border-radius: 6px;
      background: #16213e;
      color: #eee;
      font-size: 1rem;
      appearance: auto;
    }

    @media (max-width: 700px) {
      .bar-row {
        flex-direction: column;
      }
      .app { padding: 0.8rem; }
      h1 { font-size: 1.3rem; margin-bottom: 0.5rem; }
      .controls { margin-bottom: 0.8rem; }
      .presets-row { display: none; }
      .presets-select { display: block; }
      .settings-row {
        flex-direction: column;
        gap: 0.6rem;
      }
      .settings-row .tempo-section {
        min-width: 100%;
      }
      .tab-cell span { font-size: 1.2rem; height: 1.5rem; }
      .tab-labels span { font-size: 0.85rem; height: 1.5rem; }
      .edit-bar {
        gap: 0.5rem;
        padding: 0.5rem 0.6rem;
        font-size: 0.8rem;
      }
      .edit-bar label { font-size: 0.75rem; }
    }

    @media (max-width: 480px) {
      .app { padding: 0.5rem; }
      h1 { font-size: 1.1rem; margin-bottom: 0.4rem; }
      .controls { gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
      .controls button { padding: 0.5rem 1.2rem; font-size: 0.9rem; }
      .count-in-btn { width: 38px; height: 38px; font-size: 1rem; }
      .visualizer { height: 30px; }
      .bar-container { padding: 0.6rem; }
      .beat-cell { padding: 2px; }
      .beat-cell .note-label { font-size: 1.8rem; height: 1.8rem; width: 1.6rem; }
      .app.edit-mode .beat-cell .note-name { font-size: 0.5rem; }
      .beat-cell .pitch-input { max-width: 32px; font-size: 0.75rem; }
      .beat-cell .bend-input { font-size: 0.7rem; }
      .beat-cell .bend-dir { min-width: 12px; width: 14px; height: 18px; font-size: 0.7rem; }
      .tab-cell span { font-size: 1rem; height: 1.3rem; }
      .tab-labels { display: none; }
      .tab-grid-wrapper { margin-top: 1rem; padding-top: 0.5rem; }
      .add-buttons button { font-size: 1.3rem; padding: 0.2rem 0.4rem; }
      .edit-bar { gap: 0.4rem; padding: 0.4rem; }
      .edit-bar select, .edit-bar input[type="text"], .edit-bar input[type="number"] {
        padding: 0.25rem 0.3rem;
        font-size: 0.8rem;
      }
      .edit-bar .save-btn, .edit-bar .cancel-btn, .edit-bar .delete-btn {
        padding: 0.3rem 0.7rem;
        font-size: 0.8rem;
      }
      .settings-row { gap: 0.5rem; }
      .tempo-section label { font-size: 0.8rem; margin-bottom: 0.2rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Metronome Speed Trainer</h1>

    <div class="controls">
      <button id="playBtn" class="play-btn">Play</button>
      <button id="countInBtn" class="count-in-btn" title="Toggle count-in">🕐</button>
      <button id="easeInBtn" class="count-in-btn" title="Start 2 BPM below">🐢</button>
      <button id="editBtn" class="count-in-btn" title="Edit">✏️</button>
      <button id="createNewBtn" class="count-in-btn" title="Create new preset">➕</button>
      <button id="resetBtn" class="reset-btn">Reset</button>
    </div>

    <div class="edit-bar" id="editBar">
      <label>Name</label>
      <input type="text" id="editName" placeholder="Preset name">
      <label>Key</label>
      <select id="editKey">
        <option value="Am">Am</option>
        <option value="A#m">A#m/Bbm</option>
        <option value="Bm">Bm</option>
        <option value="Cm">Cm</option>
        <option value="C#m">C#m</option>
        <option value="Dm">Dm</option>
        <option value="D#m">D#m/Ebm</option>
        <option value="Em">Em</option>
        <option value="Fm">Fm</option>
        <option value="F#m">F#m</option>
        <option value="Gm">Gm</option>
        <option value="G#m">G#m/Abm</option>
      </select>
      <label>Box</label>
      <input type="number" id="editBox" min="1" max="5" value="1">
      <button class="save-btn" id="editSaveBtn">Save</button>
      <button class="cancel-btn" id="editCancelBtn">Cancel</button>
      <button class="delete-btn" id="editDeleteBtn">Delete</button>
    </div>

    <div class="presets-section">
      <label>Presets</label>
      <div class="presets-row" id="presetsRow"></div>
      <select class="presets-select" id="presetsSelect"><option value="">-- Select preset --</option></select>
    </div>

    <div class="visualizer" id="visualizer">
      <div class="flash" id="flash"></div>
      <div class="playhead-line" id="playhead"></div>
    </div>

    <div class="settings-row">
      <div class="tempo-section">
        <label>Tempo</label>
        <div class="tempo-row">
          <input type="range" id="tempoSlider" min="20" max="300" value="120">
          <input type="number" id="tempoInput" min="20" max="300" value="120">
          <span>BPM</span>
        </div>
      </div>
      <div class="tempo-section">
        <label>Volume</label>
        <div class="tempo-row">
          <input type="range" id="volSlider" min="0" max="100" value="80">
          <span id="volDisplay">80%</span>
        </div>
      </div>
      <div class="tempo-section">
        <label>Speed Up</label>
        <div class="tempo-row">

      dotted_crotchet_rest: { beats: 1.5, label: '𝄽.', height: 36, rest: true, name: 'D. Crotchet' },

      triplet_semiquaver: { beats: 1/6, label: '𝅘𝅥𝅯³', height: 18, rest: false, name: 'Trip. Semi' },
      triplet_crotchet_rest: { beats: 2/3, label: '𝄽³', height: 36, rest: true, name: 'Trip. Crotchet' },
      triplet_quaver_rest: { beats: 1/3, label: '𝄾³', height: 26, rest: true, name: 'Trip. Quaver' },
      triplet_semiquaver_rest: { beats: 1/6, label: '𝄿³', height: 18, rest: true, name: 'Trip. Semi' }

    document.querySelectorAll('.palette-toggle').forEach(toggle => {
      toggle.addEventListener('click', () => {
        toggle.classList.toggle('open');

        body.classList.toggle('open');
      });

    const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    function noteToFreq(name) {
      if (!name) return null;
      const match = name.trim().match(/^([A-Ga-g])(#|b)?(\d)$/);
      if (!match) return null;
      let note = match[1].toUpperCase();
      const acc = match[2];
      const oct = parseInt(match[3]);
      let semitone = NOTE_NAMES.indexOf(note);
      if (semitone === -1) return null;
      if (acc === '#') semitone++;
      if (acc === 'b') semitone--;
      const midi = (oct + 1) * 12 + semitone;
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    let bars = [[], []];
    let tempo = 120;
    let volume = 0.8;
    let speedUpBpm = 0;
    let speedUpBars = 4;
    let loopCount = 0;
    let playing = false;
    let editMode = false;
    let isCreatingNew = false;
    let preEditBars = null;
    let userPresets = JSON.parse(localStorage.getItem('metronome_user_presets') || '[]');
    let audioCtx = null;
    let nextNoteTime = 0;
    let currentNote = 0;
    let timerID = null;
    let pattern = [];

    const tempoSlider = document.getElementById('tempoSlider');
    const tempoInput = document.getElementById('tempoInput');
    const playBtn = document.getElementById('playBtn');
    const resetBtn = document.getElementById('resetBtn');
    const flash = document.getElementById('flash');
    const playhead = document.getElementById('playhead');
    const visualizer = document.getElementById('visualizer');

    tempoSlider.addEventListener('input', () => {
      tempo = parseInt(tempoSlider.value);
      tempoInput.value = tempo;
      saveState();

    tempoInput.addEventListener('change', () => {

      tempoInput.value = tempo;

    const volSlider = document.getElementById('volSlider');

    const speedUpBpmInput = document.getElementById('speedUpBpm');
    const speedUpBarsInput = document.getElementById('speedUpBars');

      saveState();

    speedUpBarsInput.addEventListener('change', () => {

    document.querySelectorAll('.add-buttons button').forEach(btn => {
      btn.addEventListener('click', () => {
        const bar = parseInt(btn.dataset.bar);

    resetBtn.addEventListener('click', () => {
      stop();

    playBtn.addEventListener('click', () => {

    });

    function noteBarColor(beats) {
      // Log scale so short notes (0.17–0.5) spread out visually
      const minB = 1/6, maxB = 4;
      const t = (Math.log(beats) - Math.log(minB)) / (Math.log(maxB) - Math.log(minB));
      const clamped = Math.max(0, Math.min(1, t));
      const r = Math.round(255 - clamped * 155); // 255 → 100
      const g = Math.round(100 - clamped * 90);  // 100 → 10
      const b = Math.round(110 - clamped * 100); // 110 → 10
      return `rgb(${r},${g},${b})`;
    }

    function renderBars() {
      for (let b = 0; b < 2; b++) {
        const wrapper = document.getElementById(`bar${b}Wrapper`);
        const info = document.getElementById(`bar${b}Info`);
        const hasNotes = bars[b].some(item => {
          const t = typeof item === 'string' ? item : item.type;
          return !NOTE_TYPES[t].rest;
        });
        wrapper.innerHTML = '';
        const notesRow = document.createElement('div');
        notesRow.className = 'bar-notes-row';
        if (bars[b].length > 0 && hasNotes) {
          notesRow.innerHTML = `<div class="bar-labels"><span></span><span></span><span></span><span>Pitch</span><span>Bend</span></div>`;
        }
        const grid = document.createElement('div');
        grid.className = 'beat-grid';
        grid.id = `bar${b}Grid`;
        notesRow.appendChild(grid);
        wrapper.appendChild(notesRow);
        let totalBeats = 0;
        bars[b].forEach((item, i) => {
          const type = typeof item === 'string' ? item : item.type;
          const note = typeof item === 'string' ? '' : (item.note || '');
          const bend = typeof item === 'string' ? 0 : (item.bend || 0);
          const bendAbs = Math.abs(bend);
          const bendUp = bend >= 0;
          if (typeof item === 'string') bars[b][i] = { type, note, bend: 0 };
          const isRest = NOTE_TYPES[type].rest;
          totalBeats += NOTE_TYPES[type].beats;
          const cell = document.createElement('div');
          cell.className = 'beat-cell' + (i === 0 && b === 0 && !isRest ? ' accent' : '');
          cell.style.flex = `${NOTE_TYPES[type].beats} 1 0`;
          const barColor = isRest ? '#555' : noteBarColor(NOTE_TYPES[type].beats);
          if (isRest) {
            cell.innerHTML = `
              <div class="note-bar" style="background:${barColor}"><button class="remove-btn">&times;</button></div>
              <span class="note-label music-symbol">${NOTE_TYPES[type].label}</span>
              <span class="note-name">${NOTE_TYPES[type].name}</span>
              <span></span>
              <span></span>
            `;
          } else {
            const bendIndicator = bendAbs > 0 ? `<span class="bend-indicator">${bendUp ? '↑' : '↓'}${bendAbs}</span>` : '';
            cell.innerHTML = `
              <div class="note-bar" style="background:${barColor}"><button class="remove-btn">&times;</button></div>
              <span class="note-label music-symbol">${NOTE_TYPES[type].label}</span>${bendIndicator}
              <span class="note-name">${NOTE_TYPES[type].name}</span>
              <input class="pitch-input" type="text" value="${note}" placeholder="C4" maxlength="3">
              <div class="bend-row">
                <button class="bend-dir" title="Toggle bend direction">${bendUp ? '↑' : '↓'}</button>
                <input class="bend-input" type="number" value="${bendAbs}" placeholder="0" min="0" max="24">
              </div>
            `;
            cell.querySelector('.pitch-input').addEventListener('change', (e) => {
              bars[b][i].note = e.target.value;
              renderTab();
              saveState();
            });
            cell.querySelector('.bend-dir').addEventListener('click', (e) => {
              e.stopPropagation();
              const current = bars[b][i].bend || 0;
              bars[b][i].bend = -current || (current === 0 ? 0 : -current);
              const btn = e.target;
              const isNowUp = bars[b][i].bend >= 0;
              btn.textContent = isNowUp ? '↑' : '↓';
              saveState();
            });
            cell.querySelector('.bend-input').addEventListener('change', (e) => {
              const val = Math.abs(parseInt(e.target.value) || 0);
              const dir = (bars[b][i].bend || 0) >= 0 ? 1 : -1;
              bars[b][i].bend = val * dir;
              renderTab();
              saveState();
            });
          }
          cell.querySelector('.remove-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            bars[b].splice(i, 1);
            renderBars();
            saveState();
          });
          grid.appendChild(cell);
        });
        info.textContent = '';
      }
      const bar1Container = document.getElementById('bar1Container');
      if (bar1Container) {
        bar1Container.style.display = (!editMode && bars[1].length === 0) ? 'none' : '';
      }
      renderTickMarkers();
      renderTab();
    }

    function renderTickMarkers() {
      document.querySelectorAll('.tick-marker').forEach(el => el.remove());
      const flat = buildPattern();
      if (flat.length === 0) return;
      const totalBeats = flat.reduce((s, n) => s + n.beats, 0);
      let pos = 0;
      flat.forEach((note) => {
        const marker = document.createElement('div');
        marker.className = 'tick-marker';
        marker.style.left = (pos / totalBeats * 100) + '%';
        visualizer.appendChild(marker);
        pos += note.beats;
      });
    }

    const GUITAR_STRINGS = [
      { name: 'e', midi: 64 },
      { name: 'B', midi: 59 },
      { name: 'G', midi: 55 },
      { name: 'D', midi: 50 },
      { name: 'A', midi: 45 },
      { name: 'E', midi: 40 }
    ];

    function noteToMidi(name) {
      if (!name) return null;
      const match = name.trim().match(/^([A-Ga-g])(#|b)?(\d)$/);
      if (!match) return null;
      let note = match[1].toUpperCase();
      const acc = match[2];
      const oct = parseInt(match[3]);
      let semitone = NOTE_NAMES.indexOf(note);
      if (semitone === -1) return null;
      if (acc === '#') semitone++;
      if (acc === 'b') semitone--;
      return (oct + 1) * 12 + semitone;
    }

    const ROOT_FRETS = {
      'E': 12, 'F': 1, 'F#': 2, 'Gb': 2, 'G': 3, 'G#': 4, 'Ab': 4, 'A': 5,
      'A#': 6, 'Bb': 6, 'B': 7, 'C': 8, 'C#': 9, 'Db': 9, 'D': 10, 'D#': 11, 'Eb': 11
    };

    const BOX_OFFSETS = [
      { low: 0, high: 3 },
      { low: 3, high: 5 },
      { low: 5, high: 8 },
      { low: 7, high: 10 },
      { low: 10, high: 12 }
    ];

    let currentBox = 1;

    function getBoxParams() {
      const rootNote = currentKey.replace('m', '');
      const rootFret = ROOT_FRETS[rootNote] !== undefined ? ROOT_FRETS[rootNote] : 5;
      const offsets = BOX_OFFSETS[(currentBox - 1) % 5];
      const low = rootFret + offsets.low;
      const high = rootFret + offsets.high;
      const octaveDrop = low >= 9 ? 0 : 12;
      return { low, high, octaveDrop };
    }

    function midiToStringFret(midi) {
      const box = getBoxParams();
      midi -= box.octaveDrop;
      let best = null;
      for (let s = 0; s < 4; s++) {
        const fret = midi - GUITAR_STRINGS[s].midi;
        if (fret < 0 || fret > 15) continue;
        const inBox = fret >= box.low && fret <= box.high;
        if (!best) {
          best = { string: s, fret };
        } else {
          const bestInBox = best.fret >= box.low && best.fret <= box.high;
          if (inBox && !bestInBox) {
            best = { string: s, fret };
          } else if (inBox === bestInBox) {
            if (s < best.string) best = { string: s, fret };
          }
        }
      }
      return best;
    }

    function stringFretToNote(stringIdx, fret) {
      const box = getBoxParams();
      const midi = GUITAR_STRINGS[stringIdx].midi + fret + box.octaveDrop;
      const noteIdx = midi % 12;
      const octave = Math.floor(midi / 12) - 1;
      return NOTE_NAMES[noteIdx] + octave;
    }

    function parseTabInput(value) {
      const match = value.trim().match(/^(\d+)(?:b(\d+))?$/);
      if (!match) return null;
      const fret = parseInt(match[1]);
      const bendTarget = match[2] ? parseInt(match[2]) : null;
      const bend = bendTarget !== null ? (bendTarget - fret) : 0;
      return { fret, bend };
    }

    function renderTab() {
      const STRING_NAMES = GUITAR_STRINGS.map(s => s.name);
      for (let b = 0; b < 2; b++) {
        const existing = document.getElementById(`tabGrid${b}`);
        if (existing) existing.remove();

        if (bars[b].length === 0) continue;
        const hasNotes = bars[b].some(item => {
          const t = typeof item === 'string' ? item : item.type;
          return !NOTE_TYPES[t].rest;
        });
        if (!hasNotes) continue;

        const wrapper = document.createElement('div');
        wrapper.className = 'tab-grid-wrapper';
        wrapper.id = `tabGrid${b}`;

        const labels = document.createElement('div');
        labels.className = 'tab-labels';
        for (let s = 0; s < 6; s++) {
          const sp = document.createElement('span');
          sp.textContent = STRING_NAMES[s];
          labels.appendChild(sp);
        }
        wrapper.appendChild(labels);

        const grid = document.createElement('div');
        grid.className = 'tab-grid';

        bars[b].forEach((item, noteIdx) => {
          const type = typeof item === 'string' ? item : item.type;
          const note = typeof item === 'string' ? '' : (item.note || '');
          const bend = typeof item === 'string' ? 0 : (item.bend || 0);
          const isRest = NOTE_TYPES[type].rest;
          const beats = NOTE_TYPES[type].beats;

          const cell = document.createElement('div');
          cell.className = 'tab-cell';
          cell.style.flex = `${beats} 1 0`;

          const midi = (!isRest && note) ? noteToMidi(note) : null;
          const storedString = (typeof item !== 'string' && item.string !== undefined) ? item.string : null;
          let pos = null;
          if (midi) {
            if (storedString !== null) {
              const box = getBoxParams();
              const adjustedMidi = midi - box.octaveDrop;
              const fret = adjustedMidi - GUITAR_STRINGS[storedString].midi;
              if (fret >= 0) pos = { string: storedString, fret };
              else pos = midiToStringFret(midi);
            } else {
              pos = midiToStringFret(midi);
            }
          }

          for (let s = 0; s < 6; s++) {
            const sp = document.createElement('span');
            if (!isRest && !pos && s === 0) {
              sp.classList.add('tab-fret');
              sp.textContent = 'x';
            } else if (pos && s === pos.string) {
              sp.classList.add('tab-fret');
              if (bend !== 0) {
                const targetFret = pos.fret + Math.abs(bend);
                sp.textContent = pos.fret + 'b' + targetFret;
              } else {
                sp.textContent = pos.fret;
              }
            } else {
              sp.textContent = '-';
            }
            if (editMode) {
              sp.style.cursor = 'pointer';
              const barIdx = b;
              const stringIdx = s;
              sp.addEventListener('click', () => {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'tab-edit-input';
                input.value = sp.classList.contains('tab-fret') ? sp.textContent : '';
                input.placeholder = '7';
                sp.textContent = '';
                sp.appendChild(input);
                input.focus();
                input.select();
                const commit = () => {
                  const parsed = parseTabInput(input.value);
                  if (parsed) {
                    const currentType = bars[barIdx][noteIdx].type;
                    const isRest = NOTE_TYPES[currentType].rest;
                    if (isRest) {
                      const beats = NOTE_TYPES[currentType].beats;
                      const noteType = Object.keys(NOTE_TYPES).find(k =>
                        !NOTE_TYPES[k].rest && NOTE_TYPES[k].beats === beats
                      );
                      if (noteType) bars[barIdx][noteIdx].type = noteType;
                    }
                    const noteName = stringFretToNote(stringIdx, parsed.fret);
                    bars[barIdx][noteIdx].note = noteName;
                    bars[barIdx][noteIdx].bend = parsed.bend;
                    bars[barIdx][noteIdx].string = stringIdx;
                  } else if (input.value.trim() === '') {
                    const currentType = bars[barIdx][noteIdx].type;
                    const beats = NOTE_TYPES[currentType].beats;
                    const restType = Object.keys(NOTE_TYPES).find(k =>
                      NOTE_TYPES[k].rest && NOTE_TYPES[k].beats === beats
                    );
                    if (restType) {
                      bars[barIdx][noteIdx] = { type: restType, note: '', bend: 0 };
                    }
                  }
                  renderBars();
                  saveState();
                };
                input.addEventListener('blur', commit);
                input.addEventListener('keydown', (e) => {
                  if (e.key === 'Enter') { input.blur(); }
                  if (e.key === 'Escape') { input.value = ''; input.blur(); }
                });
              });
            }
            cell.appendChild(sp);
          }
          grid.appendChild(cell);
        });

        wrapper.appendChild(grid);
        const barGridWrapper = document.getElementById(`bar${b}Wrapper`);
        barGridWrapper.appendChild(wrapper);
      }
    }

    function buildPattern() {
      const flat = [];
      for (let b = 0; b < 2; b++) {
        if (bars[b].length === 0) continue;
        bars[b].forEach((item) => {
          const type = typeof item === 'string' ? item : item.type;
          const note = typeof item === 'string' ? '' : (item.note || '');
          const bend = typeof item === 'string' ? 0 : (item.bend || 0);
          const isRest = NOTE_TYPES[type].rest;
          flat.push({
            type,
            beats: NOTE_TYPES[type].beats,
            accent: flat.length === 0 && !isRest,
            freq: noteToFreq(note),
            bend,
            rest: isRest
          });
        });
      }
      return flat;
    }

    function start() {
      pattern = buildPattern();
      if (pattern.length === 0) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      playing = true;
      playBtn.classList.add('playing');
      currentNote = 0;
      loopCount = 0;

      if (easeInEnabled) {
        tempo = Math.max(20, tempo - 2);
        tempoSlider.value = tempo;
        tempoInput.value = tempo;
      }

      if (countInEnabled) {
        countingIn = true;
        playBtn.textContent = '1...';
        const beatDur = 60.0 / tempo;
        const startTime = audioCtx.currentTime + 0.05;
        for (let i = 0; i < 4; i++) {
          scheduleCountClick(startTime + i * beatDur, i);
        }
        nextNoteTime = startTime + 4 * beatDur;
        const countInDuration = (4 * beatDur - 0.1) * 1000;
        setTimeout(() => {
          if (!playing) return;
          countingIn = false;
          playBtn.textContent = 'Stop';
          scheduler();
        }, countInDuration);
      } else {
        playBtn.textContent = 'Stop';
        nextNoteTime = audioCtx.currentTime + 0.05;
        scheduler();
      }
    }

    function scheduleCountClick(time, beat) {
      const osc = audioCtx.createOscillator();
      osc.type = 'square';
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const freq = beat === 0 ? 1200 : 900;
      const vol = (beat === 0 ? 0.4 : 0.3) * volume;
      osc.frequency.setValueAtTime(freq, time);
      gain.gain.setValueAtTime(vol, time);
      gain.gain.linearRampToValueAtTime(0.001, time + 0.04);
      osc.start(time);
      osc.stop(time + 0.05);

      const delay = (time - audioCtx.currentTime) * 1000;
      setTimeout(() => {
        if (!playing) return;
        playBtn.textContent = (beat + 1) + '...';
        flash.classList.add('on');
        setTimeout(() => flash.classList.remove('on'), 15);
      }, Math.max(0, delay));
    }

    function stop() {
      playing = false;
      countingIn = false;
      playBtn.textContent = 'Play';
      playBtn.classList.remove('playing');
      if (timerID) { clearTimeout(timerID); timerID = null; }
      playhead.style.left = '0%';
    }

    function scheduler() {
      while (nextNoteTime < audioCtx.currentTime + 0.1) {
        scheduleNote(currentNote, nextNoteTime);
        const note = pattern[currentNote];
        const beatDuration = 60.0 / tempo;
        nextNoteTime += note.beats * beatDuration;
        currentNote++;
        if (currentNote >= pattern.length) {
          currentNote = 0;
          loopCount++;
          if (speedUpBpm > 0 && loopCount % speedUpBars === 0) {
            tempo = Math.min(300, tempo + speedUpBpm);
            tempoSlider.value = tempo;
            tempoInput.value = tempo;
          }
        }
      }
      timerID = setTimeout(scheduler, 25);
    }

    function scheduleNote(noteIndex, time) {
      const note = pattern[noteIndex];
      const isAccent = note.accent;

      const totalBeats = pattern.reduce((s, n) => s + n.beats, 0);
      let pos = 0;
      for (let i = 0; i < noteIndex; i++) pos += pattern[i].beats;
      const pct = pos / totalBeats * 100;
      const delay = (time - audioCtx.currentTime) * 1000;
      setTimeout(() => {
        if (!playing) return;
        playhead.style.left = pct + '%';
        if (!note.rest) {
          if (noteIndex === 0) {
            flash.style.left = '0';
            flash.style.width = '100%';
            flash.style.marginLeft = '0';
            flash.style.background = 'rgba(255,255,255,1)';
          } else {
            flash.style.left = pct + '%';
            flash.style.width = '80px';
            flash.style.marginLeft = '-40px';
            flash.style.background = 'radial-gradient(ellipse at center, rgba(255,255,255,1) 0%, rgba(255,255,255,0.6) 30%, rgba(255,255,255,0) 70%)';
          }
          flash.classList.add('on');
          setTimeout(() => flash.classList.remove('on'), 15);
        }
        highlightCell(noteIndex);
      }, Math.max(0, delay));

      if (note.rest) return;

      const osc = audioCtx.createOscillator();
      osc.type = 'sawtooth';
      const osc2 = audioCtx.createOscillator();
      osc2.type = 'square';

      const preGain = audioCtx.createGain();
      preGain.gain.value = 12;
      const preGain2 = audioCtx.createGain();
      preGain2.gain.value = 4;

      const distortion = audioCtx.createWaveShaper();
      distortion.curve = makeDistortionCurve(600);
      distortion.oversample = '4x';

      const midBoost = audioCtx.createBiquadFilter();
      midBoost.type = 'peaking';
      midBoost.frequency.value = 800;
      midBoost.Q.value = 2;
      midBoost.gain.value = 8;

      const presence = audioCtx.createBiquadFilter();
      presence.type = 'peaking';
      presence.frequency.value = 2500;
      presence.Q.value = 1.5;
      presence.gain.value = 4;

      const cabinet = audioCtx.createBiquadFilter();
      cabinet.type = 'lowpass';
      cabinet.frequency.value = 4000;
      cabinet.Q.value = 1.2;

      const highpass = audioCtx.createBiquadFilter();
      highpass.type = 'highpass';
      highpass.frequency.value = 80;

      const gain = audioCtx.createGain();

      const mixer = audioCtx.createGain();
      osc.connect(preGain);
      osc2.connect(preGain2);
      preGain.connect(mixer);
      preGain2.connect(mixer);
      mixer.connect(distortion);
      distortion.connect(midBoost);
      midBoost.connect(presence);
      presence.connect(cabinet);
      cabinet.connect(highpass);
      highpass.connect(gain);
      gain.connect(audioCtx.destination);

      const baseFreq = note.freq || (isAccent ? 1000 : 800);
      const beatDur = note.beats * (60.0 / tempo);
      const hasBend = note.bend !== 0;
      const dur = hasBend ? beatDur * 0.95 : Math.min(beatDur * 0.95, 0.3);
      osc.frequency.setValueAtTime(baseFreq, time);
      osc2.frequency.setValueAtTime(baseFreq * 1.002, time);
      if (hasBend) {
        const endFreq = baseFreq * Math.pow(2, note.bend / 12);
        osc.frequency.linearRampToValueAtTime(endFreq, time + dur);
        osc2.frequency.linearRampToValueAtTime(endFreq * 1.002, time + dur);
      }
      const accentBoost = (noteIndex === 0) ? 1.2 : 1.0;
      const vol = (isAccent ? 0.35 : 0.22) * volume * accentBoost;
      gain.gain.setValueAtTime(vol, time);
      gain.gain.setValueAtTime(vol, time + dur * 0.75);
      gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

      osc.start(time);
      osc2.start(time);
      osc.stop(time + dur + 0.01);
      osc2.stop(time + dur + 0.01);
    }

    function makeDistortionCurve(amount) {
      const samples = 44100;
      const curve = new Float32Array(samples);
      const deg = Math.PI / 180;
      for (let i = 0; i < samples; i++) {
        const x = (i * 2) / samples - 1;
        curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
      }
      return curve;
    }

    function getPresetOverrides() {
      const saved = localStorage.getItem('metronome_presets');
      return saved ? JSON.parse(saved) : {};

    function savePresetOverride(index) {
      const overrides = getPresetOverrides();

      localStorage.setItem('metronome_presets', JSON.stringify(overrides));

    function loadPreset(preset, index) {
      stop();
      if (editMode) exitEditMode();
      const d = preset.data;
      const overrides = getPresetOverrides();
      const ov = overrides[index];
      bars = JSON.parse(JSON.stringify(d.bars));
      currentKey = preset.key || 'Am';
      currentBox = preset.box || 1;
      tempo = ov ? ov.tempo : d.tempo;
      volume = ov ? ov.volume : d.volume;
      speedUpBpm = ov ? ov.speedUpBpm : d.speedUpBpm;
      speedUpBars = ov ? ov.speedUpBars : d.speedUpBars;
      tempoSlider.value = tempo;
      tempoInput.value = tempo;
      volSlider.value = Math.round(volume * 100);
      volDisplay.textContent = Math.round(volume * 100) + '%';
      speedUpBpmInput.value = speedUpBpm;
      speedUpBarsInput.value = speedUpBars;
      activePresetIndex = index;
      renderBars();
      saveState();
      const row = document.getElementById('presetsRow');
      row.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      const btns = row.querySelectorAll('.preset-btn');

    function renderPresets() {
      const row = document.getElementById('presetsRow');
      const select = document.getElementById('presetsSelect');
      row.innerHTML = '';
      select.innerHTML = '<option value="">-- Select preset --</option>';
      const allPresets = [...PRESETS, ...userPresets];
      allPresets.forEach((preset, i) => {
        const container = document.createElement('span');
        container.style.position = 'relative';
        container.style.display = 'inline-block';
        const btn = document.createElement('button');
        btn.className = 'preset-btn';
        btn.textContent = preset.name;
        btn.addEventListener('click', () => loadPreset(preset, i));
        container.appendChild(btn);
        if (i >= PRESETS.length) {
          const del = document.createElement('button');
          del.textContent = '×';
          del.style.cssText = 'position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:#e94560;color:white;border:none;font-size:10px;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1;';
          container.addEventListener('mouseenter', () => del.style.display = 'flex');
          container.addEventListener('mouseleave', () => del.style.display = 'none');
          del.addEventListener('click', (e) => {
            e.stopPropagation();
            const userIdx = i - PRESETS.length;
            userPresets.splice(userIdx, 1);
            localStorage.setItem('metronome_user_presets', JSON.stringify(userPresets));
            if (activePresetIndex === i) activePresetIndex = null;
            else if (activePresetIndex > i) activePresetIndex--;
            renderPresets();
            saveState();
          });
          container.appendChild(del);
        }
        row.appendChild(container);
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = preset.name;
        if (i === activePresetIndex) opt.selected = true;
        select.appendChild(opt);
      });
    }

    document.getElementById('presetsSelect').addEventListener('change', (e) => {
      const idx = parseInt(e.target.value);
      if (isNaN(idx)) return;
      const allPresets = [...PRESETS, ...userPresets];
      loadPreset(allPresets[idx], idx);
    });

    loadState();
    renderPresets();
    renderBars();
    if (activePresetIndex !== null) {
      const btns = document.getElementById('presetsRow').querySelectorAll('.preset-btn');
      if (btns[activePresetIndex]) btns[activePresetIndex].classList.add('active');
    }
    if (editMode) enterEditMode(false);

    // Capacitor keyboard integration
    if (window.Capacitor) {
      import('@capacitor/keyboard').then(({ Keyboard }) => {
        Keyboard.addListener('keyboardWillShow', (info) => {
          document.body.style.paddingBottom = info.keyboardHeight + 'px';
          const active = document.activeElement;
          if (active && active.scrollIntoViewIfNeeded) {
            active.scrollIntoViewIfNeeded(true);
          } else if (active) {
            active.scrollIntoView({ block: 'center' });
          }
        });
        Keyboard.addListener('keyboardWillHide', () => {
          document.body.style.paddingBottom = 'env(safe-area-inset-bottom)';
        });
      }).catch(() => {});

      import('@capacitor/status-bar').then(({ StatusBar, Style }) => {
        StatusBar.setStyle({ style: Style.Dark });
        StatusBar.setBackgroundColor({ color: '#1a1a2e' });
      }).catch(() => {});
    }
  </script>
</body>
</html>
