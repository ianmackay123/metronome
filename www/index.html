<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Guitar Lick Speed Trainer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
  <style>
    @font-face {
      font-family: 'Noto Music';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(fonts/NotoMusic.ttf) format('truetype');
    }
    .music-symbol {
      font-family: 'Noto Music', 'Noto Sans Symbols2', 'Segoe UI Symbol', 'Apple Symbols', serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; scrollbar-width: none; }
    *::-webkit-scrollbar { display: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #1a1a2e, #2a2a4e);
      color: #eee;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    .app {
      max-width: 1100px;
      width: 100%;
      padding: 1rem 1.5rem;
      margin: 0 auto;
      box-sizing: border-box;
      overflow-x: hidden;
      overflow-y: auto;
      flex: 1;
      -webkit-overflow-scrolling: touch;
    }
    .settings-row {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
      width: 100%;
      box-sizing: border-box;
    }
    .settings-row .tempo-section {
      margin-bottom: 0;
      width: 100%;
    }
    .bar-row {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }
    .bar-row .bar-grid-wrapper {
      flex: 1;
      min-width: 0;
    }
    h1 {
      text-align: center;
      margin-bottom: 0.6rem;
      font-size: 1.5rem;
      color: #e94560;
    }
    .tempo-section {
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      width: 100%;
      box-sizing: border-box;
    }
    .tempo-section label {
      font-weight: 600;
      white-space: nowrap;
      min-width: 55px;
    }
    .tempo-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex: 1;
      min-width: 0;
    }
    .tempo-row input[type="range"] {
      flex: 1;
      min-width: 0;
      accent-color: #e94560;
    }
    .tempo-display {
      min-width: 40px;
      padding: 0.3rem 0.5rem;
      color: #eee;
      text-align: center;
      font-size: 1rem;
    }
    .max-bpm {
      font-size: 0.8rem;
      color: #888;
      white-space: nowrap;
      padding-left: 0.3rem;
      line-height: 1.4;
    }
    .all-time-max {
      font-size: 0.65rem;
      color: #666;
    }
    .tempo-arrow {
      background: #16213e;
      border: 1px solid #444;
      border-radius: 4px;
      color: #eee;
      padding: 0.3rem 0.5rem;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .tempo-arrow:active { background: #e94560; }
    .pattern-section {
      margin-bottom: 1rem;
    }
    .pattern-section h2 {
      font-size: 1rem;
      margin-bottom: 0.4rem;
    }
    .note-palette {
      background: #16213e;
      border-radius: 8px;
      padding: 0.6rem;
      margin-bottom: 0.8rem;
      display: none;
    }
    .app.edit-mode .note-palette { display: block; }
    .app.edit-mode .presets-section,
    .app.edit-mode .visualizer,
    .app.edit-mode #speedUpSection { display: none; }
    .ctrl-item.ctrl-normal { display: flex; }
    .app.edit-mode .ctrl-item.ctrl-normal { display: none; }
    .ctrl-item.ctrl-edit { display: none; }
    .app.edit-mode .ctrl-item.ctrl-edit { display: flex; }
    .beat-cell .remove-btn { display: none !important; }
    .app.edit-mode .beat-cell .remove-btn { display: flex !important; }
    .beat-cell .pitch-input,
    .beat-cell .bend-display,
    .beat-cell .note-name { display: none !important; }
    .beat-cell .bend-indicator {
      font-size: 0.7rem;
      color: #ff8a5c;
      position: absolute;
      top: 22px;
      right: 2px;
      line-height: 1;
    }
    .app.edit-mode .beat-cell .bend-indicator { display: none; }
    .app.edit-mode .beat-cell { grid-template-rows: 22px 2.4rem 6px auto auto; }
    .app.edit-mode .beat-cell .pitch-input { display: block !important; grid-row: 4; justify-self: start; }
    .app.edit-mode .beat-cell .bend-display { display: block !important; grid-row: 5; justify-self: start; margin-top: 4px; }
    .edit-bar {
      display: none;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1rem;
      padding: 0.6rem 1rem;
      background: #16213e;
      border-radius: 8px;
      flex-wrap: nowrap;
    }
    .app.edit-mode .edit-bar { display: flex; }
    .edit-bar label { font-size: 0.85rem; color: #ccc; }
    .edit-bar select, .edit-bar input[type="text"], .edit-bar input[type="number"] {
      padding: 0.3rem 0.5rem;
      border: 1px solid #444;
      border-radius: 4px;
      background: #0f3460;
      color: #eee;
      font-size: 0.85rem;
      min-width: 0;
    }
    .edit-bar #editName { flex: 1; min-width: 80px; }
    .edit-bar #editKey { width: 50px; flex: none; }
    .edit-bar #editBox { width: 30px; flex: none; }
    .edit-bar input[type="number"] { width: 45px; max-width: 15vw; }
    .edit-bar select { max-width: 25vw; }
    .controls .save-btn { border-color: #27ae60; color: #27ae60; }
    .controls .save-btn:hover { background: #27ae60; color: white; }
    .controls .cancel-btn:hover { background: #444; }
    .controls .delete-btn { border-color: #e94560; color: #e94560; }
    .controls .delete-btn:hover { background: #e94560; color: white; }
    .ctrl-item.ctrl-delete.hidden { display: none !important; }
    .palette-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 0.3rem 0;
      user-select: none;
    }
    .palette-toggle h3 {
      font-size: 0.85rem;
      color: #ccc;
    }
    .palette-toggle .arrow {
      font-size: 0.7rem;
      color: #888;
      transition: transform 0.2s;
    }
    .palette-toggle.open .arrow { transform: rotate(180deg); }
    .palette-body {
      display: none;
      padding-top: 0.4rem;
    }
    .palette-body.open { display: block; }
    .add-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      gap: 1rem;
      flex-wrap: nowrap;
    }
    .add-group {
      display: flex;
      flex-direction: column;
      flex-shrink: 1;
      min-width: 0;
    }
    .add-group:last-child {
      align-items: flex-end;
    }
    .add-group:last-child .add-buttons {
      justify-content: flex-end;
    }
    .add-group .add-buttons {
      margin-bottom: 0;
      flex-wrap: nowrap;
    }
    .add-group-label {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #777;
      margin-bottom: 0.2rem;
    }
    .add-buttons {
      display: flex;
      gap: 0.3rem;
      margin-bottom: 0.4rem;
      flex-wrap: wrap;
    }
    .add-section-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #777;
      margin-top: 0.4rem;
      margin-bottom: 0.15rem;
    }
    .add-buttons button {
      padding: 0.25rem 0.4rem;
      border: 1px solid #444;
      border-radius: 4px;
      background: #0f3460;
      color: #eee;
      cursor: pointer;
      font-family: 'Noto Music', 'Noto Sans Symbols2', 'Segoe UI Symbol', 'Apple Symbols', -apple-system, sans-serif;
      font-size: 1.7rem;
      transition: background 0.15s;
      flex-shrink: 1;
      min-width: 0;
    }
    .add-buttons button:hover { background: #1a5276; }
    .bar-container {
      background: #16213e;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      min-height: 60px;
    }
    .bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .bar-label {
      font-weight: 600;
      font-size: 0.9rem;
      color: #aaa;
    }
    .bar-beats-info {
      font-size: 0.8rem;
      color: #888;
    }
    .beat-grid {
      display: flex;
      gap: 0;
      align-items: stretch;
      width: 100%;
      min-width: 0;
      overflow: hidden;
    }
    .app.edit-mode .beat-grid { overflow: visible; }
    .beat-cell {
      display: grid;
      grid-template-rows: 22px 2.4rem 0 0 0;
      align-items: start;
      justify-items: start;
      cursor: pointer;
      border-radius: 4px;
      padding: 4px 4px;
      transition: background 0.15s;
      position: relative;
      min-width: 0;
      border-right: 1px solid rgba(255,255,255,0.05);
    }
    .beat-cell:last-child { border-right: none; }
    .bar-grid-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
    }
    .bar-notes-row {
      position: relative;
      display: flex;
      align-items: stretch;
      width: 100%;
    }
    .bar-labels {
      display: none;
    }
    .app.edit-mode .bar-labels {
      display: grid;
      grid-template-rows: 22px 2.4rem 6px 26px 26px;
      align-items: center;
      position: absolute;
      right: 100%;
      top: 0;
      padding-right: 6px;
    }
    .bar-labels span {
      font-size: 0.6rem;
      color: #777;
      text-align: right;
      white-space: nowrap;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      justify-self: center;
      align-self: center;
    }
    .beat-cell:hover { background: rgba(233,69,96,0.15); }
    .beat-cell.active { background: rgba(233,69,96,0.35); }
    .beat-cell .note-bar {
      position: relative;
      width: 90%;
      height: 100%;
      border-radius: 3px;
    }
    .beat-cell .note-label {
      font-family: 'Noto Music', 'Noto Sans Symbols2', 'Segoe UI Symbol', 'Apple Symbols', serif;
      font-size: 2.4rem;
      color: #aaa;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2.4rem;
      overflow: hidden;
    }
    .beat-cell .note-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.55rem;
      color: #666;
      margin-top: 1px;
    }
    .beat-cell .pitch-input {
      width: 100%;
      max-width: 38px;
      height: 22px;
      font-size: 0.85rem;
      text-align: center;
      border: 1px solid #444;
      border-radius: 3px;
      background: #0f3460;
      color: #eee;
      padding: 0 1px;
      margin-bottom: 4px;
    }
    .beat-cell .pitch-input:focus {
      outline: 1px solid #e94560;
      border-color: #e94560;
    }
    .beat-cell .bend-display {
      width: 100%;
      max-width: 38px;
      height: 22px;
      font-size: 0.85rem;
      text-align: center;
      border: 1px solid #444;
      border-radius: 3px;
      background: #0f3460;
      color: #ff8a5c;
      padding: 0 1px;
      cursor: pointer;
    }
    .fret-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }
    .fret-grid button {
      padding: 10px 0;
      border: 1px solid #444;
      border-radius: 5px;
      background: #0f3460;
      color: #eee;
      font-size: 1rem;
      cursor: pointer;
      text-align: center;
    }
    .fret-grid button.selected {
      background: #e94560;
      border-color: #e94560;
      color: #fff;
    }
    .pitch-overlay-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .pitch-overlay-backdrop.active { display: flex; }
    .pitch-overlay {
      background: #16213e;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .pitch-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .pitch-col button {
      padding: 8px 14px;
      border: 1px solid #444;
      border-radius: 5px;
      background: #0f3460;
      color: #eee;
      font-size: 1rem;
      cursor: pointer;
      min-width: 40px;
      text-align: center;
    }
    .pitch-col button.selected {
      background: #e94560;
      border-color: #e94560;
      color: #fff;
    }
    .pitch-ok {
      align-self: flex-end;
      padding: 8px 18px;
      background: #e94560;
      border: none;
      border-radius: 5px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      margin-top: auto;
    }
    .beat-cell .remove-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 10px;
      border: none;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
      z-index: 2;
    }
    .controls {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      margin-bottom: 0.8rem;
    }
    .ctrl-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .ctrl-label {
      font-size: 0.6rem;
      color: #888;
      text-align: center;
      white-space: nowrap;
    }
    .controls button {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid #444;
      background: #333;
      color: #eee;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 0;
      transition: transform 0.1s, background 0.15s, border-color 0.15s;
    }
    .controls button svg {
      flex-shrink: 0;
      display: block;
      stroke: currentColor;
    }
    .controls button:hover { border-color: #e94560; }
    .controls button:active { transform: scale(0.95); }
    .play-footer {
      flex-shrink: 0;
      padding: 12px 1.5rem;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }
    .play-footer .slow-play-btn {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      border: 1px solid #e94560;
      background: transparent;
      color: #e94560;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      transition: background 0.15s, transform 0.1s;
    }
    .play-footer .slow-play-btn:active { transform: scale(0.97); }
    .play-footer .slow-play-btn.playing { background: #ff8a5c; border-color: #ff8a5c; color: white; }
    .play-footer .play-btn {
      width: 100%;
      max-width: 400px;
      height: 56px;
      border-radius: 14px;
      border: none;
      background: #e94560;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
      touch-action: manipulation;
    }
    .play-footer .play-btn:active { transform: scale(0.97); }
    .play-footer .play-btn.playing { background: #ff8a5c; }
    .play-footer .play-btn svg { width: 24px; height: 24px; }
    .count-in-btn.active { background: #e94560; border-color: #e94560; color: white; }
    .visualizer {
      height: 40px;
      background: #16213e;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .visualizer .tick-marker {
      position: absolute;
      bottom: 0;
      width: 2px;
      background: #444;
      height: 100%;
    }
    .visualizer .playhead-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 3px;
      background: #e94560;
      border-radius: 2px;
      transition: left 0.05s linear;
    }
    .visualizer .flash {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 80px;
      margin-left: -40px;
      background: radial-gradient(ellipse at center, rgba(255,255,255,1) 0%, rgba(255,255,255,0.6) 30%, rgba(255,255,255,0) 70%);
      opacity: 0;
      transition: opacity 0.12s ease-out;
      pointer-events: none;
    }
    .visualizer .flash.on { opacity: 1; transition: none; }

    .presets-section {
      margin-bottom: 1rem;
    }

    .tab-grid-wrapper {
      position: relative;
      width: 100%;
      margin-top: 1.5rem;
      border-top: none;
      padding: 0.8rem;
      background: #2a3a5e;
      border-radius: 6px;
    }
    .tab-labels {
      position: absolute;
      right: 100%;
      top: 0.8rem;
      display: flex;
      flex-direction: column;
      padding-right: 6px;
    }
    .tab-labels span {
      font-size: 1rem;
      font-family: 'SF Pro Display', 'Inter', 'Roboto', -apple-system, sans-serif;
      font-weight: 700;
      color: #777;
      line-height: 1.3;
      height: 1.8rem;
      text-align: right;
      -webkit-font-smoothing: antialiased;
    }
    .tab-grid {
      display: flex;
      gap: 0;
      width: 100%;
      min-width: 0;
      overflow: hidden;
    }
    .tab-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
    }
    .tab-cell span {
      font-family: 'SF Pro Display', 'Inter', 'Roboto', -apple-system, sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #aaa;
      line-height: 1.3;
      height: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      padding-left: 4px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .tab-cell span.tab-fret {
      color: #e94560;
      font-weight: 800;
    }
    .tab-edit-input {
      width: 100%;
      max-width: 40px;
      height: 1.6rem;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      text-align: center;
      border: 1px solid #e94560;
      border-radius: 3px;
      background: #0f3460;
      color: #e94560;
      padding: 0 2px;
      outline: none;
    }

    button, select, input { touch-action: manipulation; }


    @media (max-width: 700px) {
      .bar-row {
        flex-direction: column;
      }
      .app { padding: 0.8rem; }
      h1 { font-size: 1.3rem; margin-bottom: 0.5rem; }
      .controls { margin-bottom: 0.8rem; }
      .settings-row {
        flex-direction: column;
        gap: 0.6rem;
      }
      .tab-cell span { font-size: 1.2rem; height: 1.5rem; }
      .tab-labels span { font-size: 0.85rem; height: 1.5rem; }
      .edit-bar {
        gap: 0.5rem;
        padding: 0.5rem 0.6rem;
        font-size: 0.8rem;
      }
      .edit-bar label { font-size: 0.75rem; }
    }

    @media (max-width: 480px) {
      .app { padding: 0.5rem; }
      h1 { font-size: 1.1rem; margin-bottom: 0.4rem; }
      .controls { gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
      .controls button { padding: 0.5rem 1.2rem; font-size: 0.9rem; }
      .controls button { width: 38px; height: 38px; }
      .visualizer { height: 30px; }
      .bar-container { padding: 0.6rem; }
      .beat-cell { padding: 2px; }
      .beat-cell .note-label { font-size: 1.8rem; height: 1.8rem; width: 1.6rem; }
      .app.edit-mode .beat-cell .note-name { font-size: 0.5rem; }
      .beat-cell .pitch-input { max-width: 32px; font-size: 0.75rem; }
      .beat-cell .bend-display { font-size: 0.75rem; max-width: 32px; }
      .tab-cell span { font-size: 1rem; height: 1.3rem; }
      .tab-labels { font-size: 0.7rem; }
      .tab-labels span { font-size: 0.7rem; height: 1.3rem; }
      .tab-grid-wrapper { margin-top: 1rem; padding-top: 0.5rem; }
      .add-buttons button { font-size: 1.3rem; padding: 0.2rem 0.4rem; }
      .edit-bar { gap: 0.4rem; padding: 0.4rem; }
      .edit-bar select, .edit-bar input[type="text"], .edit-bar input[type="number"] {
        padding: 0.25rem 0.3rem;
        font-size: 0.8rem;
      }
      .settings-row { gap: 0.5rem; }
      .tempo-section label { font-size: 0.8rem; margin-bottom: 0.2rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Guitar Lick Speed Trainer</h1>

    <div class="controls">

      <div class="ctrl-item"><button id="editBtn" class="count-in-btn" title="Edit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button><span class="ctrl-label">Edit</span></div>
      <div class="ctrl-item ctrl-normal"><button id="createNewBtn" class="count-in-btn" title="Create new preset"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button><span class="ctrl-label">New</span></div>
      <div class="ctrl-item ctrl-edit"><button id="resetBtn" class="reset-btn" title="Reset"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button><span class="ctrl-label">Revert</span></div>
      <div class="ctrl-item ctrl-edit"><button class="save-btn" id="editSaveBtn" title="Save"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></button><span class="ctrl-label">Save</span></div>
      <div class="ctrl-item ctrl-edit"><button class="cancel-btn" id="editCancelBtn" title="Cancel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button><span class="ctrl-label">Cancel</span></div>
      <div class="ctrl-item ctrl-edit ctrl-delete"><button class="delete-btn" id="editDeleteBtn" title="Delete"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button><span class="ctrl-label">Delete</span></div>
    </div>

    <div class="edit-bar" id="editBar">
      <label>Name</label>
      <input type="text" id="editName" placeholder="Preset name" readonly style="cursor:pointer;">
      <label>Key</label>
      <input type="text" id="editKey" value="Am" readonly style="width:50px;text-align:center;cursor:pointer;">

    <div class="presets-section" style="position:relative;">

          <span class="max-bpm" id="maxBpmDisplay">⏐ <span id="maxBpmValue">0</span> max<br><span class="all-time-max"><span id="allTimeMaxValue">0</span> all time <svg id="allTimeMaxReset" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;cursor:pointer" title="Reset all-time max"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></span></span>

                <button data-bar="0" data-type="semibreve_rest">𝄻</button>
                <button data-bar="0" data-type="minim_rest">𝄼</button>

            </div>
            <div class="add-row">
              <div class="add-group"><div class="add-group-label">Dotted</div><div class="add-buttons">
                <button data-bar="0" data-type="dotted_minim">𝅗𝅥.</button>

              <div class="add-group"><div class="add-group-label">Dotted Rests</div><div class="add-buttons">

                <button data-bar="0" data-type="triplet_crotchet">𝅘𝅥³</button>

      <div class="bar-row">

                <button data-bar="1" data-type="minim">𝅗𝅥</button>
                <button data-bar="1" data-type="crotchet">𝅘𝅥</button>

            <div class="add-row">
              <div class="add-group"><div class="add-group-label">Dotted</div><div class="add-buttons">
                <button data-bar="1" data-type="dotted_minim">𝅗𝅥.</button>
                <button data-bar="1" data-type="dotted_crotchet">𝅘𝅥.</button>

              </div></div>
              <div class="add-group"><div class="add-group-label">Dotted Rests</div><div class="add-buttons">
                <button data-bar="1" data-type="dotted_minim_rest">𝄼.</button>
                <button data-bar="1" data-type="dotted_crotchet_rest">𝄽.</button>
                <button data-bar="1" data-type="dotted_quaver_rest">𝄾.</button>

  <div class="play-footer">

    <button id="playBtn" class="play-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
  </div>

  <script>
    const NOTE_TYPES = {
      semibreve: { beats: 4, label: '𝅝', height: 44, rest: false, name: 'Semibreve' },
      minim: { beats: 2, label: '𝅗𝅥', height: 40, rest: false, name: 'Minim' },
      crotchet: { beats: 1, label: '𝅘𝅥', height: 36, rest: false, name: 'Crotchet' },
      quaver: { beats: 0.5, label: '𝅘𝅥𝅮', height: 26, rest: false, name: 'Quaver' },
      semiquaver: { beats: 0.25, label: '𝅘𝅥𝅯', height: 18, rest: false, name: 'Semiquaver' },
      dotted_minim: { beats: 3, label: '𝅗𝅥.', height: 40, rest: false, name: 'D. Minim' },
      dotted_crotchet: { beats: 1.5, label: '𝅘𝅥.', height: 36, rest: false, name: 'D. Crotchet' },
      dotted_quaver: { beats: 0.75, label: '𝅘𝅥𝅮.', height: 26, rest: false, name: 'D. Quaver' },
      dotted_semiquaver: { beats: 0.375, label: '𝅘𝅥𝅯.', height: 18, rest: false, name: 'D. Semiquaver' },
      semibreve_rest: { beats: 4, label: '𝄻', height: 44, rest: true, name: 'Semibreve' },
      minim_rest: { beats: 2, label: '𝄼', height: 40, rest: true, name: 'Minim' },
      crotchet_rest: { beats: 1, label: '𝄽', height: 36, rest: true, name: 'Crotchet' },
      quaver_rest: { beats: 0.5, label: '𝄾', height: 26, rest: true, name: 'Quaver' },
      semiquaver_rest: { beats: 0.25, label: '𝄿', height: 18, rest: true, name: 'Semiquaver' },
      dotted_minim_rest: { beats: 3, label: '𝄼.', height: 40, rest: true, name: 'D. Minim' },
      dotted_crotchet_rest: { beats: 1.5, label: '𝄽.', height: 36, rest: true, name: 'D. Crotchet' },
      dotted_quaver_rest: { beats: 0.75, label: '𝄾.', height: 26, rest: true, name: 'D. Quaver' },
      dotted_semiquaver_rest: { beats: 0.375, label: '𝄿.', height: 18, rest: true, name: 'D. Semiquaver' },
      triplet_crotchet: { beats: 2/3, label: '𝅘𝅥³', height: 36, rest: false, name: 'Trip. Crotchet' },
      triplet_quaver: { beats: 1/3, label: '𝅘𝅥𝅮³', height: 26, rest: false, name: 'Trip. Quaver' },
      triplet_semiquaver: { beats: 1/6, label: '𝅘𝅥𝅯³', height: 18, rest: false, name: 'Trip. Semi' },
      triplet_crotchet_rest: { beats: 2/3, label: '𝄽³', height: 36, rest: true, name: 'Trip. Crotchet' },
      triplet_quaver_rest: { beats: 1/3, label: '𝄾³', height: 26, rest: true, name: 'Trip. Quaver' },
      triplet_semiquaver_rest: { beats: 1/6, label: '𝄿³', height: 18, rest: true, name: 'Trip. Semi' }
    };

    document.querySelectorAll('.palette-toggle').forEach(toggle => {
      toggle.addEventListener('click', () => {
        toggle.classList.toggle('open');
        const body = toggle.nextElementSibling;
        body.classList.toggle('open');
      });
    });

    const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    function noteToFreq(name) {
      if (!name) return null;
      const match = name.trim().match(/^([A-Ga-g])(#|b)?(\d)$/);
      if (!match) return null;
      let note = match[1].toUpperCase();
      const acc = match[2];
      const oct = parseInt(match[3]);
      let semitone = NOTE_NAMES.indexOf(note);
      if (semitone === -1) return null;
      if (acc === '#') semitone++;
      if (acc === 'b') semitone--;
      const midi = (oct + 1) * 12 + semitone;
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    let wakeLock = null;
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
      }
    }
    function releaseWakeLock() {
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
    }

    let bars = [[], []];
    let tempo = 120;
    let maxBpm = 0;
    let allTimeMax = parseInt(localStorage.getItem('metronome_allTimeMax') || '0');
    let volume = 0.8;
    let speedUpBpm = 0;
    let speedUpBars = 4;
    let currentPresetName = '';
    let loopCount = 0;
    let playing = false;
    let editMode = false;
    let isCreatingNew = false;
    let preEditBars = null;
    let userPresets = JSON.parse(localStorage.getItem('metronome_user_presets') || '[]');
    let audioCtx = null;
    let playGeneration = 0;
    let nextNoteTime = 0;
    let currentNote = 0;
    let timerID = null;
    let pattern = [];

    const tempoSlider = document.getElementById('tempoSlider');
    const tempoInput = document.getElementById('tempoInput');
    const playBtn = document.getElementById('playBtn');
    const resetBtn = document.getElementById('resetBtn');
    const flash = document.getElementById('flash');
    const playhead = document.getElementById('playhead');
    const visualizer = document.getElementById('visualizer');

    tempoSlider.addEventListener('input', () => {
      tempo = parseInt(tempoSlider.value);
      tempoInput.textContent = tempo;
      saveState();
    });
    document.getElementById('tempoDown').addEventListener('click', () => {
      tempo = Math.max(20, tempo - 1);
      tempoInput.textContent = tempo;
      tempoSlider.value = tempo;
      saveState();
    });
    document.getElementById('tempoUp').addEventListener('click', () => {
      tempo = Math.min(300, tempo + 1);
      tempoInput.textContent = tempo;
      tempoSlider.value = tempo;
      saveState();
    });

    const maxBpmValue = document.getElementById('maxBpmValue');
    const allTimeMaxValue = document.getElementById('allTimeMaxValue');
    allTimeMaxValue.textContent = allTimeMax;
    allTimeMaxValue.style.color = getMaxColor(allTimeMax);

    function getMaxColor(bpm) {
      if (bpm >= 120) return '#4caf50';
      if (bpm >= 100) return '#ff9800';
      return '#e94560';
    }

    function updateMaxBpm() {
      if (tempo > maxBpm) {
        maxBpm = tempo;
        maxBpmValue.textContent = maxBpm;
        maxBpmValue.style.color = getMaxColor(maxBpm);
      }
      if (tempo > allTimeMax) {
        allTimeMax = tempo;
        allTimeMaxValue.textContent = allTimeMax;
        allTimeMaxValue.style.color = getMaxColor(allTimeMax);
        localStorage.setItem('metronome_allTimeMax', allTimeMax);
      }
    }

    document.getElementById('allTimeMaxReset').addEventListener('click', () => {
      allTimeMax = 0;
      allTimeMaxValue.textContent = allTimeMax;
      localStorage.setItem('metronome_allTimeMax', '0');
    });

    const volSlider = document.getElementById('volSlider');
    const volDisplay = document.getElementById('volDisplay');
    volSlider.addEventListener('input', () => {
      volume = parseInt(volSlider.value) / 100;
      volDisplay.textContent = volSlider.value + '%';
      saveState();
    });

    const speedUpBpmInput = document.getElementById('speedUpBpm');
    const speedUpBarsInput = document.getElementById('speedUpBars');
    speedUpBpmInput.addEventListener('click', () => {
      openNumberPicker('BPM increase', 0, 20, speedUpBpm, (val) => {
        speedUpBpm = val;
        speedUpBpmInput.value = val;
        saveState();
      });
    });
    speedUpBarsInput.addEventListener('click', () => {
      openNumberPicker('Bars between increases', 1, 32, speedUpBars, (val) => {
        speedUpBars = val;
        speedUpBarsInput.value = val;
        saveState();
      });
    });

    document.querySelectorAll('.add-buttons button').forEach(btn => {
      btn.addEventListener('click', () => {
        const bar = parseInt(btn.dataset.bar);
        const type = btn.dataset.type;
        bars[bar].push({ type, note: '' });
        activePresetIndex = null;
        renderBars();
        saveState();
      });
    });

    resetBtn.addEventListener('click', () => {
      stop();
      if (!editMode || !preEditBars) return;
      bars = JSON.parse(JSON.stringify(preEditBars));
      renderBars();
    });

    playBtn.addEventListener('click', () => {
      if (playing) { stop(); } else { start(); }
    });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !e.repeat && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        if (playing) { stop(); } else { start(); }
      }
    });

    const slowPlayBtn = document.getElementById('slowPlayBtn');
    slowPlayBtn.addEventListener('click', () => {
      if (playing) { stop(); return; }
      tempo = Math.max(20, tempo - 5);
      tempoSlider.value = tempo;
      tempoInput.textContent = tempo;
      saveState();
      start();
    });

    function noteBarColor(beats) {
      // Log scale so short notes (0.17–0.5) spread out visually
      const minB = 1/6, maxB = 4;
      const t = (Math.log(beats) - Math.log(minB)) / (Math.log(maxB) - Math.log(minB));
      const clamped = Math.max(0, Math.min(1, t));
      const r = Math.round(255 - clamped * 155); // 255 → 100
      const g = Math.round(100 - clamped * 90);  // 100 → 10
      const b = Math.round(110 - clamped * 100); // 110 → 10
      return `rgb(${r},${g},${b})`;
    }

    function renderBars() {
      for (let b = 0; b < 2; b++) {
        const wrapper = document.getElementById(`bar${b}Wrapper`);
        const info = document.getElementById(`bar${b}Info`);
        const hasNotes = bars[b].some(item => {
          const t = typeof item === 'string' ? item : item.type;
          return !NOTE_TYPES[t].rest;
        });
        wrapper.innerHTML = '';
        const notesRow = document.createElement('div');
        notesRow.className = 'bar-notes-row';
        if (bars[b].length > 0 && hasNotes) {
          notesRow.innerHTML = `<div class="bar-labels"><span></span><span></span><span></span><span>Pitch</span><span>Bend</span></div>`;
        }
        const grid = document.createElement('div');
        grid.className = 'beat-grid';
        grid.id = `bar${b}Grid`;
        notesRow.appendChild(grid);
        wrapper.appendChild(notesRow);
        let totalBeats = 0;
        bars[b].forEach((item, i) => {
          const type = typeof item === 'string' ? item : item.type;
          const note = typeof item === 'string' ? '' : (item.note || '');
          const bend = typeof item === 'string' ? 0 : (item.bend || 0);
          const bendAbs = Math.abs(bend);
          const bendUp = bend >= 0;
          if (typeof item === 'string') bars[b][i] = { type, note, bend: 0 };
          const isRest = NOTE_TYPES[type].rest;
          totalBeats += NOTE_TYPES[type].beats;
          const cell = document.createElement('div');
          cell.className = 'beat-cell' + (i === 0 && b === 0 && !isRest ? ' accent' : '');
          cell.style.flex = `${NOTE_TYPES[type].beats} 1 0`;
          const barColor = isRest ? '#555' : noteBarColor(NOTE_TYPES[type].beats);
          if (isRest) {
            cell.innerHTML = `
              <div class="note-bar" style="background:${barColor}"><button class="remove-btn">&times;</button></div>
              <span class="note-label music-symbol">${NOTE_TYPES[type].label}</span>
              <span class="note-name">${NOTE_TYPES[type].name}</span>
              <span></span>
              <span></span>
            `;
          } else {
            const bendIndicator = bendAbs > 0 ? `<span class="bend-indicator">${bendUp ? '↑' : '↓'}${bendAbs}</span>` : '';
            cell.innerHTML = `
              <div class="note-bar" style="background:${barColor}"><button class="remove-btn">&times;</button></div>
              <span class="note-label music-symbol">${NOTE_TYPES[type].label}</span>${bendIndicator}
              <span class="note-name">${NOTE_TYPES[type].name}</span>
              <input class="pitch-input" type="text" value="${note}" placeholder="C4" maxlength="3" readonly>
              <input class="bend-display" type="text" value="${bendAbs > 0 ? (bendUp ? '↑' : '↓') + bendAbs : ''}" placeholder="—" readonly>
            `;
            cell.querySelector('.pitch-input').addEventListener('click', (e) => {
              e.stopPropagation();
              openPitchPicker(e.target);
            });
            cell.querySelector('.pitch-input').addEventListener('change', (e) => {
              bars[b][i].note = e.target.value;
              renderTab();
              saveState();
            });
            cell.querySelector('.bend-display').addEventListener('click', (e) => {
              e.stopPropagation();
              openBendPicker(e.target, bars[b][i]);
            });
            cell.querySelector('.bend-display').addEventListener('change', () => {
              renderTab();
              saveState();
            });
          }
          cell.querySelector('.remove-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            bars[b].splice(i, 1);
            renderBars();
            saveState();
          });
          grid.appendChild(cell);
        });
        info.textContent = '';
      }
      const bar1Container = document.getElementById('bar1Container');
      if (bar1Container) {
        bar1Container.style.display = (!editMode && bars[1].length === 0) ? 'none' : '';
      }
      renderTickMarkers();
      renderTab();
    }

    function renderTickMarkers() {
      document.querySelectorAll('.tick-marker').forEach(el => el.remove());
      const flat = buildPattern();
      if (flat.length === 0) return;
      const totalBeats = flat.reduce((s, n) => s + n.beats, 0);
      let pos = 0;
      flat.forEach((note) => {
        const marker = document.createElement('div');
        marker.className = 'tick-marker';
        marker.style.left = (pos / totalBeats * 100) + '%';
        visualizer.appendChild(marker);
        pos += note.beats;
      });
    }

    const GUITAR_STRINGS = [
      { name: 'e', midi: 64 },
      { name: 'B', midi: 59 },
      { name: 'G', midi: 55 },
      { name: 'D', midi: 50 },
      { name: 'A', midi: 45 },
      { name: 'E', midi: 40 }
    ];

    function noteToMidi(name) {
      if (!name) return null;
      const match = name.trim().match(/^([A-Ga-g])(#|b)?(\d)$/);
      if (!match) return null;
      let note = match[1].toUpperCase();
      const acc = match[2];
      const oct = parseInt(match[3]);
      let semitone = NOTE_NAMES.indexOf(note);
      if (semitone === -1) return null;
      if (acc === '#') semitone++;
      if (acc === 'b') semitone--;
      return (oct + 1) * 12 + semitone;
    }

    const ROOT_FRETS = {
      'E': 12, 'F': 1, 'F#': 2, 'Gb': 2, 'G': 3, 'G#': 4, 'Ab': 4, 'A': 5,
      'A#': 6, 'Bb': 6, 'B': 7, 'C': 8, 'C#': 9, 'Db': 9, 'D': 10, 'D#': 11, 'Eb': 11
    };

    const BOX_OFFSETS = [
      { low: 0, high: 3 },
      { low: 3, high: 5 },
      { low: 5, high: 8 },
      { low: 7, high: 10 },
      { low: 10, high: 12 }
    ];

    let currentBox = 1;

    function getBoxParams() {
      const keyMatch = currentKey.match(/^([A-G][#b]?)/);
      const rootNote = keyMatch ? keyMatch[1] : 'A';
      const rootFret = ROOT_FRETS[rootNote] !== undefined ? ROOT_FRETS[rootNote] : 5;
      const offsets = BOX_OFFSETS[(currentBox - 1) % 5];
      const low = rootFret + offsets.low;
      const high = rootFret + offsets.high;
      const octaveDrop = low >= 9 ? 0 : 12;
      return { low, high, octaveDrop };
    }

    function midiToStringFret(midi) {
      const box = getBoxParams();
      midi -= box.octaveDrop;
      let best = null;
      for (let s = 0; s < 6; s++) {
        const fret = midi - GUITAR_STRINGS[s].midi;
        if (fret < 0 || fret > 15) continue;
        const inBox = fret >= box.low && fret <= box.high;
        if (!best) {
          best = { string: s, fret };
        } else {
          const bestInBox = best.fret >= box.low && best.fret <= box.high;
          if (inBox && !bestInBox) {
            best = { string: s, fret };
          } else if (inBox === bestInBox) {
            if (s < best.string) best = { string: s, fret };
          }
        }
      }
      return best;
    }

    function stringFretToNote(stringIdx, fret) {
      const box = getBoxParams();
      const midi = GUITAR_STRINGS[stringIdx].midi + fret + box.octaveDrop;
      const noteIdx = midi % 12;
      const octave = Math.floor(midi / 12) - 1;
      return NOTE_NAMES[noteIdx] + octave;
    }


    function renderTab() {
      const STRING_NAMES = GUITAR_STRINGS.map(s => s.name);
      for (let b = 0; b < 2; b++) {
        const existing = document.getElementById(`tabGrid${b}`);
        if (existing) existing.remove();

        if (bars[b].length === 0) continue;
        const hasNotes = bars[b].some(item => {
          const t = typeof item === 'string' ? item : item.type;
          return !NOTE_TYPES[t].rest;
        });
        if (!hasNotes) continue;

        const wrapper = document.createElement('div');
        wrapper.className = 'tab-grid-wrapper';
        wrapper.id = `tabGrid${b}`;

        const labels = document.createElement('div');
        labels.className = 'tab-labels';
        for (let s = 0; s < 6; s++) {
          const sp = document.createElement('span');
          sp.textContent = STRING_NAMES[s];
          labels.appendChild(sp);
        }
        wrapper.appendChild(labels);

        const grid = document.createElement('div');
        grid.className = 'tab-grid';

        bars[b].forEach((item, noteIdx) => {
          const type = typeof item === 'string' ? item : item.type;
          const note = typeof item === 'string' ? '' : (item.note || '');
          const bend = typeof item === 'string' ? 0 : (item.bend || 0);
          const isRest = NOTE_TYPES[type].rest;
          const beats = NOTE_TYPES[type].beats;

          const cell = document.createElement('div');
          cell.className = 'tab-cell';
          cell.style.flex = `${beats} 1 0`;

          const midi = (!isRest && note) ? noteToMidi(note) : null;
          const storedString = (typeof item !== 'string' && item.string !== undefined) ? item.string : null;
          let pos = null;
          if (midi) {
            if (storedString !== null) {
              const box = getBoxParams();
              const adjustedMidi = midi - box.octaveDrop;
              const fret = adjustedMidi - GUITAR_STRINGS[storedString].midi;
              if (fret >= 0) pos = { string: storedString, fret };
              else pos = midiToStringFret(midi);
            } else {
              pos = midiToStringFret(midi);
            }
          }

          for (let s = 0; s < 6; s++) {
            const sp = document.createElement('span');
            if (!isRest && !pos && s === 0) {
              sp.classList.add('tab-fret');
              sp.textContent = 'x';
            } else if (pos && s === pos.string) {
              sp.classList.add('tab-fret');
              if (bend > 0) {
                const targetFret = pos.fret + bend;
                sp.textContent = pos.fret + 'b' + targetFret;
              } else if (bend < 0) {
                const startFret = pos.fret + Math.abs(bend);
                sp.textContent = startFret + 'r' + pos.fret;
              } else {
                sp.textContent = pos.fret;
              }
            } else {
              sp.textContent = '-';
            }
            if (editMode) {
              sp.style.cursor = 'pointer';
              const barIdx = b;
              const stringIdx = s;
              sp.addEventListener('click', () => {
                let currentFret = '';
                if (sp.classList.contains('tab-fret')) {
                  const txt = sp.textContent;
                  const bIdx = txt.indexOf('b');
                  currentFret = bIdx > 0 ? txt.substring(0, bIdx) : txt;
                }
                const currentBend = bars[barIdx][noteIdx].bend || 0;
                openFretPicker(currentFret, (fret, bend) => {
                  if (fret !== null) {
                    const currentType = bars[barIdx][noteIdx].type;
                    const isRest = NOTE_TYPES[currentType].rest;
                    if (isRest) {
                      const beats = NOTE_TYPES[currentType].beats;
                      const noteType = Object.keys(NOTE_TYPES).find(k =>
                        !NOTE_TYPES[k].rest && NOTE_TYPES[k].beats === beats
                      );
                      if (noteType) bars[barIdx][noteIdx].type = noteType;
                    }
                    const noteName = stringFretToNote(stringIdx, fret);
                    bars[barIdx][noteIdx].note = noteName;
                    bars[barIdx][noteIdx].bend = bend;
                    bars[barIdx][noteIdx].string = stringIdx;
                  } else {
                    const currentType = bars[barIdx][noteIdx].type;
                    const beats = NOTE_TYPES[currentType].beats;
                    const restType = Object.keys(NOTE_TYPES).find(k =>
                      NOTE_TYPES[k].rest && NOTE_TYPES[k].beats === beats
                    );
                    if (restType) {
                      bars[barIdx][noteIdx] = { type: restType, note: '', bend: 0 };
                    }
                  }
                  renderBars();
                  saveState();
                }, currentBend);
              });
            }
            cell.appendChild(sp);
          }
          grid.appendChild(cell);
        });

        wrapper.appendChild(grid);
        const barGridWrapper = document.getElementById(`bar${b}Wrapper`);
        barGridWrapper.appendChild(wrapper);
      }
    }

    function buildPattern() {
      const flat = [];
      for (let b = 0; b < 2; b++) {
        if (bars[b].length === 0) continue;
        bars[b].forEach((item) => {
          const type = typeof item === 'string' ? item : item.type;
          const note = typeof item === 'string' ? '' : (item.note || '');
          const bend = typeof item === 'string' ? 0 : (item.bend || 0);
          const isRest = NOTE_TYPES[type].rest;
          flat.push({
            type,
            beats: NOTE_TYPES[type].beats,
            accent: flat.length === 0 && !isRest,
            freq: noteToFreq(note),
            bend,
            rest: isRest
          });
        });
      }
      return flat;
    }

    let countingIn = false;
    let countInEnabled = false;
    let preEaseInTempo = null;

    const countInBtn = document.getElementById('countInBtn');
    countInBtn.addEventListener('click', () => {
      countInEnabled = !countInEnabled;
      countInBtn.classList.toggle('active', countInEnabled);
    });

    let easeInEnabled = false;

    const editBtn = document.getElementById('editBtn');
    const createNewBtn = document.getElementById('createNewBtn');
    const editSaveBtn = document.getElementById('editSaveBtn');
    const editCancelBtn = document.getElementById('editCancelBtn');
    const editNameInput = document.getElementById('editName');
    const editKeySelect = document.getElementById('editKey');
    const editBoxInput = document.getElementById('editBox');

    function enterEditMode(creating) {
      editMode = true;
      isCreatingNew = creating;
      preEditBars = JSON.parse(JSON.stringify(bars));
      document.querySelector('.app').classList.add('edit-mode');
      editBtn.classList.add('active');
      if (creating) {
        bars = [[], []];
        preEditBars = [[], []];
        activePresetIndex = null;
        editNameInput.value = '';
      } else {
        editNameInput.value = currentPresetName || '';
      }
      editKeySelect.value = currentKey;
      editBoxInput.value = currentBox;
      editDeleteBtn.closest('.ctrl-item').classList.toggle('hidden', creating || activePresetIndex === null);
      renderBars();
    }

    function exitEditMode() {
      editMode = false;
      isCreatingNew = false;
      preEditBars = null;
      document.querySelector('.app').classList.remove('edit-mode');
      editBtn.classList.remove('active');
      renderBars();
    }

    function getActivePreset() {
      if (activePresetIndex === null) return null;
      if (activePresetIndex < PRESETS.length) return PRESETS[activePresetIndex];
      return userPresets[activePresetIndex - PRESETS.length] || null;
    }

    editKeySelect.addEventListener('click', () => {
      if (!editMode) return;
      openKeyPicker();
    });
    editBoxInput.addEventListener('click', () => {
      if (!editMode) return;
      openBoxPicker(editBoxInput);
      renderTab();
    });

    editBtn.addEventListener('click', () => {
      if (editMode) { exitEditMode(); return; }
      enterEditMode(false);
    });

    createNewBtn.addEventListener('click', () => {
      if (editMode) exitEditMode();
      enterEditMode(true);
    });

    editCancelBtn.addEventListener('click', () => {
      if (preEditBars) {
        bars = preEditBars;
      }
      exitEditMode();
      saveState();
    });

    const editDeleteBtn = document.getElementById('editDeleteBtn');
    editDeleteBtn.addEventListener('click', () => {
      if (activePresetIndex === null) return;
      const preset = getActivePreset();
      openConfirmOverlay(`Delete "${preset.name}"?`, () => {
        if (activePresetIndex < PRESETS.length) {
          PRESETS.splice(activePresetIndex, 1);
        } else {
          userPresets.splice(activePresetIndex - PRESETS.length, 1);
          localStorage.setItem('metronome_user_presets', JSON.stringify(userPresets));
        }
        activePresetIndex = null;
        bars = [[], []];
        exitEditMode();
        renderPresets();
        renderBars();
        saveState();
      });
    });

    editSaveBtn.addEventListener('click', () => {
      const name = editNameInput.value.trim();
      if (!name) {
        editNameInput.style.outline = '2px solid #e94560';
        editNameInput.focus();
        setTimeout(() => { editNameInput.style.outline = ''; }, 1500);
        return;
      }
      const key = editKeySelect.value;
      const box = parseInt(editBoxInput.value) || 1;
      currentKey = key;
      currentBox = box;

      const presetData = {
        bars: JSON.parse(JSON.stringify(bars)),
        tempo, volume, speedUpBpm, speedUpBars
      };

      if (isCreatingNew || activePresetIndex === null) {
        userPresets.push({ name, key, box, data: presetData });
        activePresetIndex = PRESETS.length + userPresets.length - 1;
      } else if (activePresetIndex < PRESETS.length) {
        const builtIn = PRESETS[activePresetIndex];
        builtIn.name = name;
        builtIn.key = key;
        builtIn.box = box;
        builtIn.data = presetData;
      } else {
        const idx = activePresetIndex - PRESETS.length;
        userPresets[idx] = { name, key, box, data: presetData };
      }

      localStorage.setItem('metronome_user_presets', JSON.stringify(userPresets));
      exitEditMode();
      saveState();
      renderPresets();
    });

    function start() {
      pattern = buildPattern();
      if (pattern.length === 0) return;
      maxBpm = tempo;
      maxBpmValue.textContent = maxBpm;
      maxBpmValue.style.color = getMaxColor(maxBpm);
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        handleAudioInterruption();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      requestWakeLock();
      playing = true;
      playGeneration++;
      const gen = playGeneration;
      playBtn.classList.add('playing');
      slowPlayBtn.classList.add('playing');
      currentNote = 0;
      loopCount = 0;

      if (easeInEnabled) {
        preEaseInTempo = tempo;
        tempo = Math.max(20, tempo - 2);
        tempoSlider.value = tempo;
        tempoInput.textContent = tempo;
      }

      if (countInEnabled) {
        countingIn = true;
        playBtn.textContent = '1...';
        const beatDur = 60.0 / tempo;
        const startTime = audioCtx.currentTime + 0.05;
        for (let i = 0; i < 4; i++) {
          scheduleCountClick(startTime + i * beatDur, i);
        }
        nextNoteTime = startTime + 4 * beatDur;
        const countInDuration = (4 * beatDur - 0.1) * 1000;
        setTimeout(() => {
          if (!playing || gen !== playGeneration) return;
          countingIn = false;
          playBtn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
          scheduler();
        }, countInDuration);
      } else {
        playBtn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
        nextNoteTime = audioCtx.currentTime + 0.05;
        scheduler();
      }
    }

    function scheduleCountClick(time, beat) {
      const osc = audioCtx.createOscillator();
      osc.type = 'square';
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const freq = beat === 0 ? 1200 : 900;
      const vol = (beat === 0 ? 0.4 : 0.3) * volume;
      osc.frequency.setValueAtTime(freq, time);
      gain.gain.setValueAtTime(vol, time);
      gain.gain.linearRampToValueAtTime(0.001, time + 0.04);
      osc.start(time);
      osc.stop(time + 0.05);

      const delay = (time - audioCtx.currentTime) * 1000;
      setTimeout(() => {
        if (!playing) return;
        playBtn.textContent = (beat + 1) + '...';
        flash.classList.add('on');
        setTimeout(() => flash.classList.remove('on'), 60);
      }, Math.max(0, delay));
    }

    function stop() {
      playing = false;
      countingIn = false;
      releaseWakeLock();
      if (preEaseInTempo !== null) {
        tempo = preEaseInTempo;
        tempoSlider.value = tempo;
        tempoInput.textContent = tempo;
        preEaseInTempo = null;
      }
      playBtn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
      playBtn.classList.remove('playing');
      slowPlayBtn.classList.remove('playing');
      if (timerID) { clearTimeout(timerID); timerID = null; }
      playhead.style.left = '0%';
    }

    function scheduler() {
      while (nextNoteTime < audioCtx.currentTime + 0.25) {
        scheduleNote(currentNote, nextNoteTime);
        const note = pattern[currentNote];
        const beatDuration = 60.0 / tempo;
        nextNoteTime += note.beats * beatDuration;
        currentNote++;
        if (currentNote >= pattern.length) {
          currentNote = 0;
          loopCount++;
          if (speedUpBpm > 0 && loopCount % speedUpBars === 0) {
            tempo = Math.min(300, tempo + speedUpBpm);
            tempoSlider.value = tempo;
            tempoInput.textContent = tempo;
            updateMaxBpm();
          }
        }
      }
      timerID = setTimeout(scheduler, 25);
    }

    function scheduleNote(noteIndex, time) {
      const note = pattern[noteIndex];
      const isAccent = note.accent;

      const totalBeats = pattern.reduce((s, n) => s + n.beats, 0);
      let pos = 0;
      for (let i = 0; i < noteIndex; i++) pos += pattern[i].beats;
      const pct = pos / totalBeats * 100;
      const delay = (time - audioCtx.currentTime) * 1000;
      setTimeout(() => {
        if (!playing) return;
        playhead.style.left = pct + '%';
        if (!note.rest) {
          if (noteIndex === 0) {
            flash.style.left = '0';
            flash.style.width = '100%';
            flash.style.marginLeft = '0';
            flash.style.background = 'rgba(255,255,255,1)';
          } else {
            flash.style.left = pct + '%';
            flash.style.width = '80px';
            flash.style.marginLeft = '-40px';
            flash.style.background = 'radial-gradient(ellipse at center, rgba(255,255,255,1) 0%, rgba(255,255,255,0.6) 30%, rgba(255,255,255,0) 70%)';
          }
          flash.classList.add('on');
          setTimeout(() => flash.classList.remove('on'), 60);
        }
        highlightCell(noteIndex);
      }, Math.max(0, delay));

      if (note.rest) return;

      const osc = audioCtx.createOscillator();
      osc.type = 'sawtooth';
      const osc2 = audioCtx.createOscillator();
      osc2.type = 'square';

      const preGain = audioCtx.createGain();
      preGain.gain.value = 12;
      const preGain2 = audioCtx.createGain();
      preGain2.gain.value = 4;

      const distortion = audioCtx.createWaveShaper();
      distortion.curve = makeDistortionCurve(600);
      distortion.oversample = '4x';

      const midBoost = audioCtx.createBiquadFilter();
      midBoost.type = 'peaking';
      midBoost.frequency.value = 800;
      midBoost.Q.value = 2;
      midBoost.gain.value = 8;

      const presence = audioCtx.createBiquadFilter();
      presence.type = 'peaking';
      presence.frequency.value = 2500;
      presence.Q.value = 1.5;
      presence.gain.value = 4;

      const cabinet = audioCtx.createBiquadFilter();
      cabinet.type = 'lowpass';
      cabinet.frequency.value = 4000;
      cabinet.Q.value = 1.2;

      const highpass = audioCtx.createBiquadFilter();
      highpass.type = 'highpass';
      highpass.frequency.value = 80;

      const gain = audioCtx.createGain();

      const mixer = audioCtx.createGain();
      osc.connect(preGain);
      osc2.connect(preGain2);
      preGain.connect(mixer);
      preGain2.connect(mixer);
      mixer.connect(distortion);
      distortion.connect(midBoost);
      midBoost.connect(presence);
      presence.connect(cabinet);
      cabinet.connect(highpass);
      highpass.connect(gain);
      gain.connect(audioCtx.destination);

      const baseFreq = note.freq || (isAccent ? 1000 : 800);
      const beatDur = note.beats * (60.0 / tempo);
      const hasBend = note.bend !== 0;
      const dur = hasBend ? beatDur * 0.95 : Math.min(beatDur * 0.95, 0.3);
      osc.frequency.setValueAtTime(baseFreq, time);
      osc2.frequency.setValueAtTime(baseFreq * 1.002, time);
      if (hasBend) {
        const endFreq = baseFreq * Math.pow(2, note.bend / 12);
        osc.frequency.linearRampToValueAtTime(endFreq, time + dur);
        osc2.frequency.linearRampToValueAtTime(endFreq * 1.002, time + dur);
      }
      const accentBoost = (noteIndex === 0) ? 1.2 : 1.0;
      const vol = (isAccent ? 0.35 : 0.22) * volume * accentBoost;
      gain.gain.setValueAtTime(vol, time);
      gain.gain.setValueAtTime(vol, time + dur * 0.75);
      gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

      osc.start(time);
      osc2.start(time);
      osc.stop(time + dur + 0.01);
      osc2.stop(time + dur + 0.01);
      osc.onended = () => {
        osc.disconnect();
        osc2.disconnect();
        preGain.disconnect();
        preGain2.disconnect();
        mixer.disconnect();
        distortion.disconnect();
        midBoost.disconnect();
        presence.disconnect();
        cabinet.disconnect();
        highpass.disconnect();
        gain.disconnect();
      };
    }

    const distortionCurveCache = {};
    function makeDistortionCurve(amount) {
      if (distortionCurveCache[amount]) return distortionCurveCache[amount];
      const samples = 44100;
      const curve = new Float32Array(samples);
      const deg = Math.PI / 180;
      for (let i = 0; i < samples; i++) {
        const x = (i * 2) / samples - 1;
        curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
      }
      distortionCurveCache[amount] = curve;
      return curve;
    }

    const bendAmtCol = document.getElementById('bendAmtCol');
    let activeBendInput = null;
    let activeBendItem = null;

    ['↑ Up', '↓ Down'].forEach((label, idx) => {
      const btn = document.createElement('button');
      btn.textContent = label;
      btn.dataset.dir = idx === 0 ? '1' : '-1';
      btn.addEventListener('click', () => { bendDirCol.querySelectorAll('button').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); });
      bendDirCol.appendChild(btn);
    });
    for (let a = 0; a <= 5; a++) {
      const btn = document.createElement('button');
      btn.textContent = a;
      btn.addEventListener('click', () => { bendAmtCol.querySelectorAll('button').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); });
      bendAmtCol.appendChild(btn);
    }

    function openBendPicker(inputEl, item) {
      activeBendInput = inputEl;
      activeBendItem = item;
      const bend = item.bend || 0;
      const dir = bend >= 0 ? '1' : '-1';
      const amt = Math.abs(bend);
      bendDirCol.querySelectorAll('button').forEach(b => { b.classList.toggle('selected', b.dataset.dir === dir); });
      bendAmtCol.querySelectorAll('button').forEach(b => { b.classList.toggle('selected', b.textContent === String(amt)); });
      bendBackdrop.classList.add('active');
    }

    document.getElementById('bendOk').addEventListener('click', () => {
      if (!activeBendInput || !activeBendItem) return;
      const dir = parseInt(bendDirCol.querySelector('.selected')?.dataset.dir || '1');
      const amt = parseInt(bendAmtCol.querySelector('.selected')?.textContent || '0');
      activeBendItem.bend = amt * dir;
      activeBendInput.value = amt > 0 ? (dir > 0 ? '↑' : '↓') + amt : '';
      activeBendInput.dispatchEvent(new Event('change'));
      bendBackdrop.classList.remove('active');
      activeBendInput = null;
      activeBendItem = null;
    });

    bendBackdrop.addEventListener('click', (e) => {
      if (e.target === bendBackdrop) {
        bendBackdrop.classList.remove('active');
        activeBendInput = null;
        activeBendItem = null;
      }
    });

    // Number picker overlay
    const numBackdrop = document.createElement('div');
    numBackdrop.className = 'pitch-overlay-backdrop';
    numBackdrop.innerHTML = `
      <div class="pitch-overlay" style="flex-direction:column;align-items:stretch;gap:12px;padding:16px;min-width:220px;">
        <span id="numPickerLabel" style="color:#ccc;font-size:0.85rem;text-align:center;"></span>
        <div class="fret-grid" id="numPickerGrid" style="grid-template-columns:repeat(5,1fr);"></div>
        <button class="pitch-ok" id="numPickerOk">OK</button>
      </div>
    `;
    document.body.appendChild(numBackdrop);
    let numPickerCallback = null;

    function openNumberPicker(label, min, max, current, callback) {
      numPickerCallback = callback;
      document.getElementById('numPickerLabel').textContent = label;
      const grid = document.getElementById('numPickerGrid');
      grid.innerHTML = '';
      for (let n = min; n <= max; n++) {
        const btn = document.createElement('button');
        btn.textContent = n;
        if (n === current) btn.classList.add('selected');
        btn.addEventListener('click', () => {
          grid.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
        });
        grid.appendChild(btn);
      }
      numBackdrop.classList.add('active');
    }

    document.getElementById('numPickerOk').addEventListener('click', () => {
      const sel = document.getElementById('numPickerGrid').querySelector('.selected');
      if (numPickerCallback && sel) numPickerCallback(parseInt(sel.textContent));
      numBackdrop.classList.remove('active');
      numPickerCallback = null;
    });

    numBackdrop.addEventListener('click', (e) => {
      if (e.target === numBackdrop) {
        numBackdrop.classList.remove('active');
        numPickerCallback = null;
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && playing) {
        stop();
      } else if (!document.hidden && audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    });

    function handleAudioInterruption() {
      if (!audioCtx) return;
      audioCtx.addEventListener('statechange', () => {
        if (audioCtx.state === 'interrupted' || audioCtx.state === 'suspended') {
          if (playing) stop();
        }
      });
    }

    if (window.Capacitor && window.Capacitor.Plugins) {
      const { Keyboard, StatusBar, App } = window.Capacitor.Plugins;
      if (App) {
        App.addListener('appStateChange', ({ isActive }) => {
          if (!isActive && playing) {
            stop();
          } else if (isActive && audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        });
      }
      if (Keyboard) {
        Keyboard.addListener('keyboardWillShow', (info) => {
          document.body.style.paddingBottom = info.keyboardHeight + 'px';
          const active = document.activeElement;
          if (active && active.scrollIntoViewIfNeeded) {
            active.scrollIntoViewIfNeeded(true);
          } else if (active) {
            active.scrollIntoView({ block: 'center' });
          }
        });
        Keyboard.addListener('keyboardWillHide', () => {
          document.body.style.paddingBottom = 'env(safe-area-inset-bottom)';
        });
      }
      if (StatusBar) {
        StatusBar.setStyle({ style: 'DARK' });
        StatusBar.setBackgroundColor({ color: '#1a1a2e' });
      }
    }
  </script>
</body>
</html>
