<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metronome Speed Trainer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Music&display=swap">
  <style>
    .music-symbol {
      font-family: 'Noto Music', 'Noto Sans Symbols2', 'Segoe UI Symbol', 'Apple Symbols', serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
    }
    .app {
      max-width: 1100px;
      width: 100%;
      padding: 1rem 1.5rem;
      margin: 0 auto;
    }
    .settings-row {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .settings-row .tempo-section {
      margin-bottom: 0;
      flex: 1;
      min-width: 150px;
    }
    .bar-row {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }
    .bar-row .note-palette {
      flex-shrink: 0;
      width: 220px;
      margin-bottom: 0;
    }
    .bar-row .bar-grid-wrapper {
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }
    h1 {
      text-align: center;
      margin-bottom: 0.6rem;
      font-size: 1.5rem;
      color: #e94560;
    }
    .tempo-section {
      margin-bottom: 0.8rem;
    }
    .tempo-section label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
    }
    .tempo-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .tempo-row input[type="range"] {
      flex: 1;
      accent-color: #e94560;
    }
    .tempo-row input[type="number"] {
      width: 70px;
      padding: 0.3rem;
      border: 1px solid #444;
      border-radius: 4px;
      background: #16213e;
      color: #eee;
      text-align: center;
      font-size: 1rem;
    }
    .pattern-section {
      margin-bottom: 1rem;
    }
    .pattern-section h2 {
      font-size: 1rem;
      margin-bottom: 0.4rem;
    }
    .note-palette {
      background: #16213e;
      border-radius: 8px;
      padding: 0.6rem;
      margin-bottom: 0.8rem;
    }
    .palette-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 0.3rem 0;
      user-select: none;
    }
    .palette-toggle h3 {
      font-size: 0.85rem;
      color: #ccc;
    }
    .palette-toggle .arrow {
      font-size: 0.7rem;
      color: #888;
      transition: transform 0.2s;
    }
    .palette-toggle.open .arrow { transform: rotate(180deg); }
    .palette-body {
      display: none;
      padding-top: 0.4rem;
    }
    .palette-body.open { display: block; }
    .add-buttons {
      display: flex;
      gap: 0.3rem;
      margin-bottom: 0.4rem;
      flex-wrap: wrap;
    }
    .add-section-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #777;
      margin-top: 0.4rem;
      margin-bottom: 0.15rem;
    }
    .add-buttons button {
      padding: 0.25rem 0.5rem;
      border: 1px solid #444;
      border-radius: 4px;
      background: #0f3460;
      color: #eee;
      cursor: pointer;
      font-family: 'Noto Music', 'Noto Sans Symbols2', 'Segoe UI Symbol', 'Apple Symbols', -apple-system, sans-serif;
      font-size: 1.7rem;
      transition: background 0.15s;
    }
    .add-buttons button:hover { background: #1a5276; }
    .bar-container {
      background: #16213e;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      min-height: 60px;
      overflow: hidden;
    }
    .bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .bar-label {
      font-weight: 600;
      font-size: 0.9rem;
      color: #aaa;
    }
    .bar-beats-info {
      font-size: 0.8rem;
      color: #888;
    }
    .beat-grid {
      display: flex;
      gap: 0;
      align-items: stretch;
      width: 100%;
      min-width: 0;
      overflow: hidden;
    }
    .beat-cell {
      display: grid;
      grid-template-rows: 44px 2.4rem 0.9rem 22px 22px;
      align-items: center;
      justify-items: start;
      cursor: pointer;
      border-radius: 4px;
      padding: 4px 4px;
      transition: background 0.15s;
      position: relative;
      min-width: 0;
      border-right: 1px solid rgba(255,255,255,0.05);
    }
    .beat-cell:last-child { border-right: none; }
    .bar-grid-wrapper {
      display: flex;
      align-items: stretch;
      width: 100%;
    }
    .bar-labels {
      display: grid;
      grid-template-rows: 44px 2.4rem 0.9rem 22px 22px;
      align-items: center;
      padding-right: 6px;
      padding: 4px 6px 4px 0;
      flex-shrink: 0;
    }
    .bar-labels span {
      font-size: 0.6rem;
      color: #777;
      text-align: right;
      white-space: nowrap;
    }
    .beat-cell:hover { background: rgba(233,69,96,0.15); }
    .beat-cell.active { background: rgba(233,69,96,0.35); }
    .beat-cell .note-bar {
      width: 90%;
      height: 100%;
      border-radius: 3px;
      background: #e94560;
    }
    .beat-cell.accent .note-bar { background: #ff6b6b; }
    .beat-cell .note-label {
      font-family: 'Noto Music', 'Noto Sans Symbols2', 'Segoe UI Symbol', 'Apple Symbols', serif;
      font-size: 2.4rem;
      color: #aaa;
      margin-top: 3px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2.4rem;
    }
    .beat-cell .note-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.55rem;
      color: #666;
      margin-top: 1px;
    }
    .beat-cell .pitch-input {
      width: 38px;
      height: 20px;
      font-size: 0.85rem;
      text-align: center;
      border: 1px solid #444;
      border-radius: 3px;
      background: #0f3460;
      color: #eee;
      padding: 0 2px;
    }
    .beat-cell .pitch-input:focus {
      outline: 1px solid #e94560;
      border-color: #e94560;
    }
    .beat-cell .bend-row {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .beat-cell .bend-dir {
      width: 20px;
      height: 20px;
      border: 1px solid #444;
      border-radius: 3px;
      background: #0f3460;
      color: #ff8a5c;
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
    }
    .beat-cell .bend-dir:hover { background: #1a5276; }
    .beat-cell .bend-input {
      width: 30px;
      height: 20px;
      font-size: 0.78rem;
      text-align: center;
      border: 1px solid #444;
      border-radius: 3px;
      background: #0f3460;
      color: #ff8a5c;
      padding: 0 2px;
    }
    .beat-cell .bend-input:focus {
      outline: 1px solid #ff8a5c;
      border-color: #ff8a5c;
    }
    .beat-cell .remove-btn {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #e94560;
      color: white;
      font-size: 9px;
      border: none;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .beat-cell:hover .remove-btn { display: flex; }
    .controls {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      margin-bottom: 0.8rem;
    }
    .controls button {
      padding: 0.6rem 1.8rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .controls button:active { transform: scale(0.95); }
    .play-btn {
      background: #e94560;
      color: white;
    }
    .play-btn.playing { background: #ff8a5c; }
    .reset-btn {
      background: #333;
      color: #eee;
    }
    .reset-btn:hover { background: #444; }
    .visualizer {
      height: 40px;
      background: #16213e;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .visualizer .tick-marker {
      position: absolute;
      bottom: 0;
      width: 2px;
      background: #444;
      height: 100%;
    }
    .visualizer .playhead-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 3px;
      background: #e94560;
      border-radius: 2px;
      transition: left 0.05s linear;
    }
    .visualizer .flash {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(233,69,96,0.3);
      opacity: 0;
      transition: opacity 0.05s;
    }
    .visualizer .flash.on { opacity: 1; transition: none; }

    .presets-section {
      margin-bottom: 1rem;
    }
    .presets-section label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }
    .presets-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .presets-row button {
      padding: 0.4rem 0.8rem;
      border: 1px solid #444;
      border-radius: 4px;
      background: #16213e;
      color: #eee;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.15s;
    }
    .presets-row button:hover { background: #0f3460; }
    .presets-row button.active {
      background: #e94560;
      border-color: #e94560;
    }

    @media (max-width: 700px) {
      .bar-row {
        flex-direction: column;
      }
      .bar-row .note-palette {
        width: 100%;
      }
      .app { padding: 0.8rem; }
      h1 { font-size: 1.3rem; margin-bottom: 0.6rem; }
      .controls { margin-bottom: 0.8rem; }
    }

    @media (max-width: 480px) {
      .settings-row { gap: 0.8rem; }
      .tempo-row { flex-wrap: wrap; gap: 0.4rem; }
      .tempo-row input[type="range"] { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Metronome Speed Trainer</h1>

    <div class="controls">
      <button id="playBtn" class="play-btn">Play</button>
      <button id="resetBtn" class="reset-btn">Reset</button>
    </div>

    <div class="presets-section">
      <label>Presets</label>
      <div class="presets-row" id="presetsRow"></div>
    </div>

    <div class="visualizer" id="visualizer">
      <div class="flash" id="flash"></div>
      <div class="playhead-line" id="playhead"></div>
    </div>

    <div class="settings-row">
      <div class="tempo-section">
        <label>Tempo</label>
        <div class="tempo-row">
          <input type="range" id="tempoSlider" min="20" max="300" value="120">
          <input type="number" id="tempoInput" min="20" max="300" value="120">
          <span>BPM</span>
        </div>
      </div>
      <div class="tempo-section">
        <label>Volume</label>
        <div class="tempo-row">
          <input type="range" id="volSlider" min="0" max="100" value="80">
          <span id="volDisplay">80%</span>
        </div>
      </div>
      <div class="tempo-section">
        <label>Speed Up</label>
        <div class="tempo-row">
          <span>+</span>
          <input type="number" id="speedUpBpm" min="0" max="20" value="0" style="width:45px;padding:0.2rem;border:1px solid #444;border-radius:4px;background:#16213e;color:#eee;text-align:center;font-size:0.85rem;">
          <span>BPM /</span>
          <input type="number" id="speedUpBars" min="1" max="64" value="4" style="width:45px;padding:0.2rem;border:1px solid #444;border-radius:4px;background:#16213e;color:#eee;text-align:center;font-size:0.85rem;">
          <span>bars</span>
        </div>
      </div>
    </div>

    <div class="bar-container">
      <div class="bar-header">
        <span class="bar-label">Bar 1</span>
        <span class="bar-beats-info" id="bar0Info">0 beats</span>
      </div>
      <div class="bar-row">
        <div class="note-palette">
          <div class="palette-toggle open" data-bar="0">
            <h3>Add Notes</h3>
            <span class="arrow">&#9660;</span>
          </div>
          <div class="palette-body open" data-bar="0">
            <div class="add-section-label">Notes</div>
            <div class="add-buttons">
              <button data-bar="0" data-type="semibreve">𝅝</button>
              <button data-bar="0" data-type="minim">𝅗𝅥</button>
              <button data-bar="0" data-type="crotchet">𝅘𝅥</button>
              <button data-bar="0" data-type="quaver">𝅘𝅥𝅮</button>
              <button data-bar="0" data-type="semiquaver">𝅘𝅥𝅯</button>
            </div>
            <div class="add-section-label">Dotted</div>
            <div class="add-buttons">
              <button data-bar="0" data-type="dotted_minim">𝅗𝅥.</button>
              <button data-bar="0" data-type="dotted_crotchet">𝅘𝅥.</button>
              <button data-bar="0" data-type="dotted_quaver">𝅘𝅥𝅮.</button>
              <button data-bar="0" data-type="dotted_semiquaver">𝅘𝅥𝅯.</button>
            </div>
            <div class="add-section-label">Rests</div>
            <div class="add-buttons">
              <button data-bar="0" data-type="semibreve_rest">𝄻</button>
              <button data-bar="0" data-type="minim_rest">𝄼</button>
              <button data-bar="0" data-type="crotchet_rest">𝄽</button>
              <button data-bar="0" data-type="quaver_rest">𝄾</button>
              <button data-bar="0" data-type="semiquaver_rest">𝄿</button>
            </div>
            <div class="add-section-label">Dotted Rests</div>
            <div class="add-buttons">
              <button data-bar="0" data-type="dotted_minim_rest">𝄼.</button>
              <button data-bar="0" data-type="dotted_crotchet_rest">𝄽.</button>
              <button data-bar="0" data-type="dotted_quaver_rest">𝄾.</button>
              <button data-bar="0" data-type="dotted_semiquaver_rest">𝄿.</button>
            </div>
            <div class="add-section-label">Triplets</div>
            <div class="add-buttons">
              <button data-bar="0" data-type="triplet_crotchet">𝅘𝅥³</button>
              <button data-bar="0" data-type="triplet_quaver">𝅘𝅥𝅮³</button>
              <button data-bar="0" data-type="triplet_semiquaver">𝅘𝅥𝅯³</button>
            </div>
            <div class="add-section-label">Triplet Rests</div>
            <div class="add-buttons">
              <button data-bar="0" data-type="triplet_crotchet_rest">𝄽³</button>
              <button data-bar="0" data-type="triplet_quaver_rest">𝄾³</button>
              <button data-bar="0" data-type="triplet_semiquaver_rest">𝄿³</button>
            </div>
          </div>
        </div>
        <div class="bar-grid-wrapper" id="bar0Wrapper"></div>
      </div>
    </div>

    <div class="bar-container">
      <div class="bar-header">
        <span class="bar-label">Bar 2 (optional)</span>
        <span class="bar-beats-info" id="bar1Info">0 beats</span>
      </div>
      <div class="bar-row">
        <div class="note-palette">
          <div class="palette-toggle" data-bar="1">
            <h3>Add Notes</h3>
            <span class="arrow">&#9660;</span>
          </div>
          <div class="palette-body" data-bar="1">
            <div class="add-section-label">Notes</div>
            <div class="add-buttons">
              <button data-bar="1" data-type="semibreve">𝅝</button>
              <button data-bar="1" data-type="minim">𝅗𝅥</button>
              <button data-bar="1" data-type="crotchet">𝅘𝅥</button>
              <button data-bar="1" data-type="quaver">𝅘𝅥𝅮</button>
              <button data-bar="1" data-type="semiquaver">𝅘𝅥𝅯</button>
            </div>
            <div class="add-section-label">Dotted</div>
            <div class="add-buttons">
              <button data-bar="1" data-type="dotted_minim">𝅗𝅥.</button>
              <button data-bar="1" data-type="dotted_crotchet">𝅘𝅥.</button>
              <button data-bar="1" data-type="dotted_quaver">𝅘𝅥𝅮.</button>
              <button data-bar="1" data-type="dotted_semiquaver">𝅘𝅥𝅯.</button>
            </div>
            <div class="add-section-label">Rests</div>
            <div class="add-buttons">
              <button data-bar="1" data-type="semibreve_rest">𝄻</button>
              <button data-bar="1" data-type="minim_rest">𝄼</button>
              <button data-bar="1" data-type="crotchet_rest">𝄽</button>
              <button data-bar="1" data-type="quaver_rest">𝄾</button>
              <button data-bar="1" data-type="semiquaver_rest">𝄿</button>
            </div>
            <div class="add-section-label">Dotted Rests</div>
            <div class="add-buttons">
              <button data-bar="1" data-type="dotted_minim_rest">𝄼.</button>
              <button data-bar="1" data-type="dotted_crotchet_rest">𝄽.</button>
              <button data-bar="1" data-type="dotted_quaver_rest">𝄾.</button>
              <button data-bar="1" data-type="dotted_semiquaver_rest">𝄿.</button>
            </div>
            <div class="add-section-label">Triplets</div>
            <div class="add-buttons">
              <button data-bar="1" data-type="triplet_crotchet">𝅘𝅥³</button>
              <button data-bar="1" data-type="triplet_quaver">𝅘𝅥𝅮³</button>
              <button data-bar="1" data-type="triplet_semiquaver">𝅘𝅥𝅯³</button>
            </div>
            <div class="add-section-label">Triplet Rests</div>
            <div class="add-buttons">
              <button data-bar="1" data-type="triplet_crotchet_rest">𝄽³</button>
              <button data-bar="1" data-type="triplet_quaver_rest">𝄾³</button>
              <button data-bar="1" data-type="triplet_semiquaver_rest">𝄿³</button>
            </div>
          </div>
        </div>
        <div class="bar-grid-wrapper" id="bar1Wrapper"></div>
      </div>
    </div>

  <script>
    const NOTE_TYPES = {
      semibreve: { beats: 4, label: '𝅝', height: 44, rest: false, name: 'Semibreve' },
      minim: { beats: 2, label: '𝅗𝅥', height: 40, rest: false, name: 'Minim' },
      crotchet: { beats: 1, label: '𝅘𝅥', height: 36, rest: false, name: 'Crotchet' },
      quaver: { beats: 0.5, label: '𝅘𝅥𝅮', height: 26, rest: false, name: 'Quaver' },
      semiquaver: { beats: 0.25, label: '𝅘𝅥𝅯', height: 18, rest: false, name: 'Semiquaver' },
      dotted_minim: { beats: 3, label: '𝅗𝅥.', height: 40, rest: false, name: 'D. Minim' },
      dotted_crotchet: { beats: 1.5, label: '𝅘𝅥.', height: 36, rest: false, name: 'D. Crotchet' },
      dotted_quaver: { beats: 0.75, label: '𝅘𝅥𝅮.', height: 26, rest: false, name: 'D. Quaver' },
      dotted_semiquaver: { beats: 0.375, label: '𝅘𝅥𝅯.', height: 18, rest: false, name: 'D. Semiquaver' },
      semibreve_rest: { beats: 4, label: '𝄻', height: 44, rest: true, name: 'Semibreve' },
      minim_rest: { beats: 2, label: '𝄼', height: 40, rest: true, name: 'Minim' },
      crotchet_rest: { beats: 1, label: '𝄽', height: 36, rest: true, name: 'Crotchet' },
      quaver_rest: { beats: 0.5, label: '𝄾', height: 26, rest: true, name: 'Quaver' },
      semiquaver_rest: { beats: 0.25, label: '𝄿', height: 18, rest: true, name: 'Semiquaver' },
      dotted_minim_rest: { beats: 3, label: '𝄼.', height: 40, rest: true, name: 'D. Minim' },
      dotted_crotchet_rest: { beats: 1.5, label: '𝄽.', height: 36, rest: true, name: 'D. Crotchet' },
      dotted_quaver_rest: { beats: 0.75, label: '𝄾.', height: 26, rest: true, name: 'D. Quaver' },
      dotted_semiquaver_rest: { beats: 0.375, label: '𝄿.', height: 18, rest: true, name: 'D. Semiquaver' },
      triplet_crotchet: { beats: 2/3, label: '𝅘𝅥³', height: 36, rest: false, name: 'Trip. Crotchet' },
      triplet_quaver: { beats: 1/3, label: '𝅘𝅥𝅮³', height: 26, rest: false, name: 'Trip. Quaver' },
      triplet_semiquaver: { beats: 1/6, label: '𝅘𝅥𝅯³', height: 18, rest: false, name: 'Trip. Semi' },
      triplet_crotchet_rest: { beats: 2/3, label: '𝄽³', height: 36, rest: true, name: 'Trip. Crotchet' },
      triplet_quaver_rest: { beats: 1/3, label: '𝄾³', height: 26, rest: true, name: 'Trip. Quaver' },
      triplet_semiquaver_rest: { beats: 1/6, label: '𝄿³', height: 18, rest: true, name: 'Trip. Semi' }
    };

    document.querySelectorAll('.palette-toggle').forEach(toggle => {
      toggle.addEventListener('click', () => {
        toggle.classList.toggle('open');
        const body = toggle.nextElementSibling;
        body.classList.toggle('open');
      });
    });

    const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    function noteToFreq(name) {
      if (!name) return null;
      const match = name.trim().match(/^([A-Ga-g])(#|b)?(\d)$/);
      if (!match) return null;
      let note = match[1].toUpperCase();
      const acc = match[2];
      const oct = parseInt(match[3]);
      let semitone = NOTE_NAMES.indexOf(note);
      if (semitone === -1) return null;
      if (acc === '#') semitone++;
      if (acc === 'b') semitone--;
      const midi = (oct + 1) * 12 + semitone;
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    let bars = [[], []];
    let tempo = 120;
    let volume = 0.8;
    let speedUpBpm = 0;
    let speedUpBars = 4;
    let loopCount = 0;
    let playing = false;
    let audioCtx = null;
    let nextNoteTime = 0;
    let currentNote = 0;
    let timerID = null;
    let pattern = [];

    const tempoSlider = document.getElementById('tempoSlider');
    const tempoInput = document.getElementById('tempoInput');
    const playBtn = document.getElementById('playBtn');
    const resetBtn = document.getElementById('resetBtn');
    const flash = document.getElementById('flash');
    const playhead = document.getElementById('playhead');
    const visualizer = document.getElementById('visualizer');

    tempoSlider.addEventListener('input', () => {
      tempo = parseInt(tempoSlider.value);
      tempoInput.value = tempo;
      saveState();
    });
    tempoInput.addEventListener('change', () => {
      tempo = Math.max(20, Math.min(300, parseInt(tempoInput.value) || 120));
      tempoInput.value = tempo;
      tempoSlider.value = tempo;
      saveState();
    });

    const volSlider = document.getElementById('volSlider');
    const volDisplay = document.getElementById('volDisplay');
    volSlider.addEventListener('input', () => {
      volume = parseInt(volSlider.value) / 100;
      volDisplay.textContent = volSlider.value + '%';
      saveState();
    });

    const speedUpBpmInput = document.getElementById('speedUpBpm');
    const speedUpBarsInput = document.getElementById('speedUpBars');
    speedUpBpmInput.addEventListener('change', () => {
      speedUpBpm = parseInt(speedUpBpmInput.value) || 0;
      saveState();
    });
    speedUpBarsInput.addEventListener('change', () => {
      speedUpBars = Math.max(1, parseInt(speedUpBarsInput.value) || 4);
      speedUpBarsInput.value = speedUpBars;
      saveState();
    });

    document.querySelectorAll('.add-buttons button').forEach(btn => {
      btn.addEventListener('click', () => {
        const bar = parseInt(btn.dataset.bar);
        const type = btn.dataset.type;
        bars[bar].push({ type, note: '' });
        renderBars();
        saveState();
      });
    });

    resetBtn.addEventListener('click', () => {
      stop();
      bars = [[], []];
      renderBars();
      saveState();
    });

    playBtn.addEventListener('click', () => {
      if (playing) { stop(); } else { start(); }
    });

    function renderBars() {
      for (let b = 0; b < 2; b++) {
        const wrapper = document.getElementById(`bar${b}Wrapper`);
        const info = document.getElementById(`bar${b}Info`);
        const hasNotes = bars[b].some(item => {
          const t = typeof item === 'string' ? item : item.type;
          return !NOTE_TYPES[t].rest;
        });
        wrapper.innerHTML = '';
        if (bars[b].length > 0 && hasNotes) {
          wrapper.innerHTML = `<div class="bar-labels"><span></span><span></span><span></span><span>Pitch</span><span>Bend</span></div>`;
        }
        const grid = document.createElement('div');
        grid.className = 'beat-grid';
        grid.id = `bar${b}Grid`;
        wrapper.appendChild(grid);
        let totalBeats = 0;
        bars[b].forEach((item, i) => {
          const type = typeof item === 'string' ? item : item.type;
          const note = typeof item === 'string' ? '' : (item.note || '');
          const bend = typeof item === 'string' ? 0 : (item.bend || 0);
          const bendAbs = Math.abs(bend);
          const bendUp = bend >= 0;
          if (typeof item === 'string') bars[b][i] = { type, note, bend: 0 };
          const isRest = NOTE_TYPES[type].rest;
          totalBeats += NOTE_TYPES[type].beats;
          const cell = document.createElement('div');
          cell.className = 'beat-cell' + (i === 0 && b === 0 && !isRest ? ' accent' : '');
          cell.style.flex = `${NOTE_TYPES[type].beats} 1 0`;
          if (isRest) {
            cell.innerHTML = `
              <div class="note-bar" style="background:#555"></div>
              <span class="note-label music-symbol">${NOTE_TYPES[type].label}</span>
              <span class="note-name">${NOTE_TYPES[type].name}</span>
              <span></span>
              <span></span>
              <button class="remove-btn">&times;</button>
            `;
          } else {
            cell.innerHTML = `
              <div class="note-bar"></div>
              <span class="note-label music-symbol">${NOTE_TYPES[type].label}</span>
              <span class="note-name">${NOTE_TYPES[type].name}</span>
              <input class="pitch-input" type="text" value="${note}" placeholder="C4" maxlength="3">
              <div class="bend-row">
                <button class="bend-dir" title="Toggle bend direction">${bendUp ? '↑' : '↓'}</button>
                <input class="bend-input" type="number" value="${bendAbs}" placeholder="0" min="0" max="24">
              </div>
              <button class="remove-btn">&times;</button>
            `;
            cell.querySelector('.pitch-input').addEventListener('change', (e) => {
              bars[b][i].note = e.target.value;
              saveState();
            });
            cell.querySelector('.bend-dir').addEventListener('click', (e) => {
              e.stopPropagation();
              const current = bars[b][i].bend || 0;
              bars[b][i].bend = -current || (current === 0 ? 0 : -current);
              const btn = e.target;
              const isNowUp = bars[b][i].bend >= 0;
              btn.textContent = isNowUp ? '↑' : '↓';
              saveState();
            });
            cell.querySelector('.bend-input').addEventListener('change', (e) => {
              const val = Math.abs(parseInt(e.target.value) || 0);
              const dir = (bars[b][i].bend || 0) >= 0 ? 1 : -1;
              bars[b][i].bend = val * dir;
              saveState();
            });
          }
          cell.querySelector('.remove-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            bars[b].splice(i, 1);
            renderBars();
            saveState();
          });
          grid.appendChild(cell);
        });
        info.textContent = totalBeats + ' beat' + (totalBeats !== 1 ? 's' : '');
      }
      renderTickMarkers();
    }

    function renderTickMarkers() {
      document.querySelectorAll('.tick-marker').forEach(el => el.remove());
      const flat = buildPattern();
      if (flat.length === 0) return;
      const totalBeats = flat.reduce((s, n) => s + n.beats, 0);
      let pos = 0;
      flat.forEach((note) => {
        const marker = document.createElement('div');
        marker.className = 'tick-marker';
        marker.style.left = (pos / totalBeats * 100) + '%';
        visualizer.appendChild(marker);
        pos += note.beats;
      });
    }

    function buildPattern() {
      const flat = [];
      for (let b = 0; b < 2; b++) {
        if (bars[b].length === 0) continue;
        bars[b].forEach((item) => {
          const type = typeof item === 'string' ? item : item.type;
          const note = typeof item === 'string' ? '' : (item.note || '');
          const bend = typeof item === 'string' ? 0 : (item.bend || 0);
          const isRest = NOTE_TYPES[type].rest;
          flat.push({
            type,
            beats: NOTE_TYPES[type].beats,
            accent: flat.length === 0 && !isRest,
            freq: noteToFreq(note),
            bend,
            rest: isRest
          });
        });
      }
      return flat;
    }

    function start() {
      pattern = buildPattern();
      if (pattern.length === 0) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      playing = true;
      playBtn.textContent = 'Stop';
      playBtn.classList.add('playing');
      currentNote = 0;
      loopCount = 0;
      nextNoteTime = audioCtx.currentTime + 0.05;
      scheduler();
    }

    function stop() {
      playing = false;
      playBtn.textContent = 'Play';
      playBtn.classList.remove('playing');
      if (timerID) { clearTimeout(timerID); timerID = null; }
      playhead.style.left = '0%';
    }

    function scheduler() {
      while (nextNoteTime < audioCtx.currentTime + 0.1) {
        scheduleNote(currentNote, nextNoteTime);
        const note = pattern[currentNote];
        const beatDuration = 60.0 / tempo;
        nextNoteTime += note.beats * beatDuration;
        currentNote++;
        if (currentNote >= pattern.length) {
          currentNote = 0;
          loopCount++;
          if (speedUpBpm > 0 && loopCount % speedUpBars === 0) {
            tempo = Math.min(300, tempo + speedUpBpm);
            tempoSlider.value = tempo;
            tempoInput.value = tempo;
          }
        }
      }
      timerID = setTimeout(scheduler, 25);
    }

    function scheduleNote(noteIndex, time) {
      const note = pattern[noteIndex];
      const isAccent = note.accent;

      const totalBeats = pattern.reduce((s, n) => s + n.beats, 0);
      let pos = 0;
      for (let i = 0; i < noteIndex; i++) pos += pattern[i].beats;
      const pct = pos / totalBeats * 100;
      const delay = (time - audioCtx.currentTime) * 1000;
      setTimeout(() => {
        if (!playing) return;
        playhead.style.left = pct + '%';
        if (!note.rest) {
          flash.classList.add('on');
          setTimeout(() => flash.classList.remove('on'), 60);
        }
        highlightCell(noteIndex);
      }, Math.max(0, delay));

      if (note.rest) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const baseFreq = note.freq || (isAccent ? 1000 : 800);
      const beatDur = note.beats * (60.0 / tempo);
      const hasBend = note.bend !== 0;
      const dur = hasBend ? beatDur * 0.9 : Math.min(beatDur * 0.9, 0.08);
      osc.frequency.setValueAtTime(baseFreq, time);
      if (hasBend) {
        const endFreq = baseFreq * Math.pow(2, note.bend / 12);
        osc.frequency.linearRampToValueAtTime(endFreq, time + dur);
      }
      const vol = (isAccent ? 1.0 : 0.66) * volume;
      gain.gain.setValueAtTime(vol, time);
      gain.gain.setValueAtTime(vol, time + dur * 0.7);
      gain.gain.linearRampToValueAtTime(0.001, time + dur);

      osc.start(time);
      osc.stop(time + dur + 0.01);
    }

    function highlightCell(noteIndex) {
      document.querySelectorAll('.beat-cell').forEach(c => c.classList.remove('active'));
      const cells = document.querySelectorAll('.beat-cell');
      if (cells[noteIndex]) cells[noteIndex].classList.add('active');
    }

    function saveState() {
      localStorage.setItem('metronome', JSON.stringify({ bars, tempo, volume, speedUpBpm, speedUpBars }));
    }

    function loadState() {
      const saved = localStorage.getItem('metronome');
      if (saved) {
        const s = JSON.parse(saved);
        bars = s.bars || [[], []];
        tempo = s.tempo || 120;
        volume = s.volume !== undefined ? s.volume : 0.8;
        speedUpBpm = s.speedUpBpm || 0;
        speedUpBars = s.speedUpBars || 4;
      } else {
        bars = [[{type:"quaver",note:"D5",bend:2},{type:"semiquaver",note:"E5",bend:0},{type:"semiquaver",note:"A5",bend:0},{type:"semiquaver",note:"G5",bend:0},{type:"semiquaver",note:"E5",bend:0},{type:"quaver",note:"D5",bend:2},{type:"semiquaver",note:"E5",bend:0},{type:"semiquaver",note:"A5",bend:0},{type:"semiquaver",note:"G5",bend:0},{type:"semiquaver",note:"E5",bend:0}],[]];
        tempo = 72;
        volume = 1;
        speedUpBpm = 1;
        speedUpBars = 1;
      }
      tempoSlider.value = tempo;
      tempoInput.value = tempo;
      volSlider.value = Math.round(volume * 100);
      volDisplay.textContent = Math.round(volume * 100) + '%';
      speedUpBpmInput.value = speedUpBpm;
      speedUpBarsInput.value = speedUpBars;
    }

    const PRESETS = [
      { name: 'Blues Bend Run', data: {"bars":[[{"type":"quaver","note":"D5","bend":2},{"type":"semiquaver","note":"E5"},{"type":"semiquaver","note":"A5"},{"type":"semiquaver","note":"G5"},{"type":"semiquaver","note":"E5"},{"type":"quaver","note":"D5","bend":2},{"type":"semiquaver","note":"E5"},{"type":"semiquaver","note":"A5"},{"type":"semiquaver","note":"G5"},{"type":"semiquaver","note":"E5"}],[]],"tempo":72,"volume":1,"speedUpBpm":1,"speedUpBars":1} },
      { name: 'Blues Lick 2', data: {"bars":[[{"type":"semiquaver","note":"A5"},{"type":"semiquaver","note":"G5"},{"type":"semiquaver","note":"E5"},{"type":"semiquaver","note":"D5"}],[]],"tempo":82,"volume":0.08,"speedUpBpm":0,"speedUpBars":1} },
      { name: 'Pentatonic Bounce', data: {"bars":[[{"type":"semiquaver","note":"D5","bend":2},{"type":"semiquaver","note":"E5"},{"type":"semiquaver","note":"A5"},{"type":"semiquaver","note":"E5"},{"type":"semiquaver","note":"g5"},{"type":"semiquaver","note":"e5"},{"type":"semiquaver","note":"D5","bend":2},{"type":"semiquaver","note":"e5"},{"type":"semiquaver","note":"a5"},{"type":"semiquaver","note":"e5"},{"type":"semiquaver","note":"g5"},{"type":"semiquaver","note":"e5"}],[]],"tempo":82,"volume":0.08,"speedUpBpm":0,"speedUpBars":1} },
      { name: 'Descending Run', data: {"bars":[[{"type":"semiquaver","note":"c6","bend":0},{"type":"semiquaver","note":"a5"},{"type":"semiquaver","note":"g5"},{"type":"semiquaver","note":"E5"},{"type":"semiquaver","note":"a5"},{"type":"semiquaver","note":"g5"},{"type":"semiquaver","note":"e5","bend":0},{"type":"semiquaver","note":"d5"},{"type":"semiquaver","note":"g5"},{"type":"semiquaver","note":"e5"},{"type":"semiquaver","note":"d5"},{"type":"semiquaver","note":"c5"},{"type":"semiquaver","note":"e5"},{"type":"semiquaver","note":"d5"},{"type":"semiquaver","note":"c5"},{"type":"semiquaver","note":"a4"}],[]],"tempo":82,"volume":0.08,"speedUpBpm":0,"speedUpBars":1} },
      { name: 'Quick Four', data: {"bars":[[{"type":"semiquaver","note":"g5","bend":0},{"type":"semiquaver","note":"e5"},{"type":"semiquaver","note":"d5"},{"type":"semiquaver","note":"e5"}],[]],"tempo":120,"volume":0.08,"speedUpBpm":0,"speedUpBars":1} },
      { name: 'Triplet Bend', data: {"bars":[[{"type":"quaver","note":"d6","bend":2},{"type":"triplet_semiquaver","note":"e6"},{"type":"triplet_semiquaver","note":"d6"},{"type":"triplet_semiquaver","note":"b5"}],[]],"tempo":82,"volume":0.08,"speedUpBpm":0,"speedUpBars":1} },
      { name: 'Triplet Bend 2', data: {"bars":[[{"type":"quaver","note":"d6","bend":2},{"type":"triplet_semiquaver","note":"e6"},{"type":"triplet_semiquaver","note":"d6"},{"type":"triplet_semiquaver","note":"b5"},{"type":"quaver","note":"a5","bend":2},{"type":"triplet_semiquaver","note":"e6"},{"type":"triplet_semiquaver","note":"d6"},{"type":"triplet_semiquaver","note":"b5"}],[]],"tempo":82,"volume":0.08,"speedUpBpm":0,"speedUpBars":1} },
      { name: 'Bend & Run', data: {"bars":[[{"type":"quaver","note":"a5","bend":2},{"type":"semiquaver","note":"b5"},{"type":"semiquaver","note":"d6"}],[]],"tempo":96,"volume":0.08,"speedUpBpm":0,"speedUpBars":1} }
    ];

    function renderPresets() {
      const row = document.getElementById('presetsRow');
      row.innerHTML = '';
      PRESETS.forEach((preset, i) => {
        const btn = document.createElement('button');
        btn.textContent = preset.name;
        btn.addEventListener('click', () => {
          stop();
          const d = preset.data;
          bars = JSON.parse(JSON.stringify(d.bars));
          tempo = d.tempo;
          volume = d.volume;
          speedUpBpm = d.speedUpBpm;
          speedUpBars = d.speedUpBars;
          tempoSlider.value = tempo;
          tempoInput.value = tempo;
          volSlider.value = Math.round(volume * 100);
          volDisplay.textContent = Math.round(volume * 100) + '%';
          speedUpBpmInput.value = speedUpBpm;
          speedUpBarsInput.value = speedUpBars;
          renderBars();
          saveState();
          row.querySelectorAll('button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
        row.appendChild(btn);
      });
    }

    loadState();
    renderPresets();
    renderBars();
  </script>
</body>
</html>
